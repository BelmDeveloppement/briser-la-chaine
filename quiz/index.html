, activité d’effacement hors horaires.\nComment l’empêcher : Sauvegardes versionnées, droits limités, restauration régulièrement testée.\nPourquoi les autres réponses sont écartées :\n• Exfiltration : rien n’est envoyé, tout est supprimé.\n• Command and Control : ne correspond pas à l’objectif décrit\n• Collection : ne correspond pas à l’objectif décrit"}],"rap":{"t":"Rappel : L’ancien collègue","pg":"page 214","h":"<p>Menace interne après un départ mal préparé. Une question par événement de l’attaque, dans l’ordre du récit.</p>"}},"def2":{"titre":"Défi TransLor 2 · Le faux fournisseur","qs":[{"q":"Chez TransLor : Un nom de domaine qui ressemble à celui d’un fournisseur de TransLor (une lettre changée) a été enregistré hier. TransLor ne le sait pas encore. Quelle tactique ATT&CK ?","o":["Resource Development","Execution","Reconnaissance","Initial Access"],"ok":0,"ind":"« domaine enregistré hier, une lettre changée » : l’attaquant prépare ses outils.","exp":"L’attaquant prépare ses outils : Resource Development (T1583.001). Piste : surveillance des domaines similaires.","det":"Bonne réponse : Resource Development.\nBut de l’attaquant : Acheter l’infrastructure de l’attaque (domaine, serveur) avant de la lancer.\nTechnique observée : T1583.001.\nComment le voir : Surveillance des noms de domaine proches du vôtre et des marques (veille sur les certificats et enregistrements récents).\nComment l’empêcher : Réserver les variantes de votre domaine, SPF/DKIM/DMARC, service de veille anti-usurpation.\nPourquoi les autres réponses sont écartées :\n• Reconnaissance : ici il achète, il n’observe pas.\n• Initial Access : ne correspond pas à l’objectif décrit\n• Execution : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : Quelqu’un a collecté sur Internet les adresses e-mail du service comptabilité et le nom du DAF. Quelle tactique ATT&CK ?","o":["Resource Development","Execution","Initial Access","Reconnaissance"],"ok":3,"ind":"« adresses collectées, nom du DAF » : on se renseigne sur la cible.","exp":"Collecte d’informations sur la cible : Reconnaissance (T1589.002).","det":"Bonne réponse : Reconnaissance.\nBut de l’attaquant : Constituer la liste des personnes à viser (adresses, fonctions) pour un hameçonnage crédible.\nTechnique observée : T1589.002.\nComment le voir : Très difficile à voir : l’information est publique. On surveille plutôt ce qui exploite la liste.\nComment l’empêcher : Limiter ce qui est publié (organigramme, signatures), sensibiliser les services exposés comme la comptabilité.\nPourquoi les autres réponses sont écartées :\n• Resource Development : l’attaquant n’a rien construit, il recueille de l’information.\n• Initial Access : ne correspond pas à l’objectif décrit\n• Execution : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : Un comptable reçoit un courriel de « son fournisseur » avec un lien vers un faux portail pour mettre à jour ses coordonnées. Quelle tactique ATT&CK ?","o":["Reconnaissance","Initial Access","Resource Development","Execution"],"ok":1,"ind":"« lien vers un faux portail » : une première interaction avec la victime.","exp":"Hameçonnage par lien : Initial Access (T1566.002).","det":"Bonne réponse : Initial Access.\nBut de l’attaquant : Faire cliquer un utilisateur sur un lien piégé pour lui voler ses identifiants.\nTechnique observée : T1566.002.\nComment le voir : Passerelle de messagerie (réputation du lien), clics sur des domaines récents, alertes d’utilisateurs.\nComment l’empêcher : Filtrage des liens, MFA résistante au hameçonnage, sensibilisation, bouton de signalement.\nPourquoi les autres réponses sont écartées :\n• Reconnaissance : le message est envoyé, la cible est déjà choisie.\n• Resource Development : ne correspond pas à l’objectif décrit\n• Execution : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : Les identifiants saisis sur le faux portail sont utilisés dans l’heure pour se connecter à la messagerie en ligne depuis un autre pays. Quelle tactique ATT&CK ?","o":["Resource Development","Persistence","Initial Access","Execution"],"ok":2,"ind":"« identifiants utilisés dans l’heure » : l’attaquant se connecte pour la première fois.","exp":"Initial Access (T1078) : compte valide obtenu par hameçonnage.","det":"Bonne réponse : Initial Access.\nBut de l’attaquant : Utiliser un vrai compte pour se faire passer pour un utilisateur légitime, sans rien exploiter.\nTechnique observée : T1078.\nComment le voir : Connexions à des heures ou depuis des pays inhabituels, compte de personne partie, voyage impossible (deux lieux éloignés en peu de temps).\nComment l’empêcher : Désactiver les comptes au départ, authentification multifacteur, revue régulière des comptes, alertes de connexion atypique.\nPourquoi les autres réponses sont écartées :\n• Persistence : on ne cherche pas encore à rester.\n• Resource Development : ne correspond pas à l’objectif décrit\n• Execution : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : L’attaquant lit pendant 3 jours les échanges avec le fournisseur et repère le calendrier des paiements. Quelle tactique ATT&CK ?","o":["Lateral Movement","Collection","Discovery","Command and Control"],"ok":1,"ind":"« lit pendant 3 jours les échanges » : il récupère de l’information.","exp":"Collection (T1114.002) : lecture de courriels distante.","det":"Bonne réponse : Collection.\nBut de l’attaquant : Lire ou copier des boîtes aux lettres pour récupérer secrets et informations de paiement.\nTechnique observée : T1114.002.\nComment le voir : Exports ou lectures massives de boîtes, appels d’API de messagerie depuis un compte inhabituel.\nComment l’empêcher : MFA, droits d’export limités, journaux d’audit de la messagerie, alertes sur les accès délégués.\nPourquoi les autres réponses sont écartées :\n• Discovery : ici on lit des données, on n’explore pas un réseau.\n• Lateral Movement : ne correspond pas à l’objectif décrit\n• Command and Control : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : Une règle de messagerie envoie dans un dossier caché tous les courriels contenant « RIB » ou « virement ». Quelle tactique ATT&CK ?","o":["Privilege Escalation","Collection","Defense Impairment","Stealth"],"ok":3,"ind":"« règle qui cache les courriels RIB/virement » : on masque les traces.","exp":"Cacher ses traces : Stealth (T1564.008).","det":"Bonne réponse : Stealth.\nBut de l’attaquant : Cacher les courriels qui révéleraient l’attaque à la victime.\nTechnique observée : T1564.008.\nComment le voir : Règles de boîte aux lettres créées récemment, redirections ou règles vers des dossiers cachés.\nComment l’empêcher : Auditer les règles de messagerie, bloquer les redirections externes, MFA.\nPourquoi les autres réponses sont écartées :\n• Collection : la règle ne vole rien, elle cache.\n• Privilege Escalation : ne correspond pas à l’objectif décrit\n• Defense Impairment : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : Dans la pièce jointe d’une vraie facture, le RIB a été remplacé par un autre sans que rien ne change visuellement. Quelle tactique ATT&CK ?","o":["Impact","Command and Control","Exfiltration","Collection"],"ok":0,"ind":"« RIB remplacé sans rien changer visuellement » : une donnée est modifiée.","exp":"Altération de données : Impact (T1565.001).","det":"Bonne réponse : Impact.\nBut de l’attaquant : Modifier des données (ici une facture) sans que rien ne paraisse changé.\nTechnique observée : T1565.001.\nComment le voir : Écart entre la pièce reçue et la valeur de référence, contrôle des changements de coordonnées.\nComment l’empêcher : Double validation par un canal connu (appel au numéro habituel), procédure de changement de RIB, contrôle d’intégrité.\nPourquoi les autres réponses sont écartées :\n• Collection : on ne copie rien, on modifie.\n• Exfiltration : ne correspond pas à l’objectif décrit\n• Command and Control : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : Un virement de 187 000 € part vers un compte inconnu. Le fournisseur n’en sait rien. Quelle tactique ATT&CK ?","o":["Collection","Command and Control","Impact","Exfiltration"],"ok":2,"ind":"« virement de 187 000 € » : le but final est atteint.","exp":"Vol financier : Impact (T1657). Piste : double validation par appel au numéro connu.","det":"Bonne réponse : Impact.\nBut de l’attaquant : Obtenir de l’argent de la victime par fraude.\nTechnique observée : T1657.\nComment le voir : Alerte de la banque, écarts sur les virements, appel au fournisseur.\nComment l’empêcher : Séparation des tâches, validation à deux personnes, rappel par un canal connu, plafonds de virement.\nPourquoi les autres réponses sont écartées :\n• Exfiltration : ce n’est pas une donnée qui sort mais de l’argent.\n• Command and Control : ne correspond pas à l’objectif décrit\n• Collection : ne correspond pas à l’objectif décrit"}],"rap":{"t":"Rappel : Le faux fournisseur","pg":"page 263","h":"<p>Fraude au RIB par hameçonnage (EXO 6). Une question par événement de l’attaque, dans l’ordre du récit.</p>"}},"def3":{"titre":"Défi TransLor 3 · Rançon en cascade","qs":[{"q":"Chez TransLor : Un salarié du service achats ouvre un devis piégé reçu par courriel. Quelle tactique ATT&CK ?","o":["Resource Development","Initial Access","Execution","Reconnaissance"],"ok":1,"ind":"« devis piégé reçu par courriel » : l’entrée par la messagerie.","exp":"Pièce jointe piégée : Initial Access (T1566.001).","det":"Bonne réponse : Initial Access.\nBut de l’attaquant : Livrer un document piégé par messagerie pour obtenir une première exécution sur un poste.\nTechnique observée : T1566.001.\nComment le voir : Pièces jointes avec macros, passerelle de messagerie, documents Office qui lancent des programmes.\nComment l’empêcher : Blocage des macros venant d’Internet, filtrage des pièces jointes, sensibilisation, bouton de signalement.\nPourquoi les autres réponses sont écartées :\n• Execution : le script viendra après, ici c’est la livraison.\n• Resource Development : ne correspond pas à l’objectif décrit\n• Reconnaissance : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : Un script PowerShell lancé depuis la pièce jointe télécharge un second programme. Quelle tactique ATT&CK ?","o":["Initial Access","Persistence","Resource Development","Execution"],"ok":3,"ind":"« script PowerShell » qui télécharge un programme.","exp":"Exécution de commandes : Execution (T1059.001).","det":"Bonne réponse : Execution.\nBut de l’attaquant : Exécuter des commandes et des scripts sur la machine compromise.\nTechnique observée : T1059.001.\nComment le voir : Journalisation PowerShell (bloc de script), lignes de commande encodées, processus parent inhabituel.\nComment l’empêcher : Mode de langage contraint, journalisation activée, restriction d’exécution des scripts, EDR.\nPourquoi les autres réponses sont écartées :\n• Initial Access : la pièce est déjà ouverte.\n• Persistence : ne correspond pas à l’objectif décrit\n• Resource Development : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : L’antivirus de plusieurs postes est arrêté sans action de l’équipe sécurité, et sa politique est modifiée. Quelle tactique ATT&CK ?","o":["Defense Impairment","Privilege Escalation","Credential Access","Stealth"],"ok":0,"ind":"« antivirus arrêté » par l’attaquant : les défenses sont affaiblies.","exp":"Arrêter les outils de sécurité : Defense Impairment (T1562.001).","det":"Bonne réponse : Defense Impairment.\nBut de l’attaquant : Arrêter ou modifier les outils de sécurité avant d’attaquer.\nTechnique observée : T1562.001.\nComment le voir : Arrêt d’un antivirus ou d’un EDR, modifications de configuration non planifiées.\nComment l’empêcher : Protection contre l’altération des agents, droits limités, alertes sur toute désactivation.\nPourquoi les autres réponses sont écartées :\n• Stealth : l’outil n’est pas contourné, il est mis hors service.\n• Credential Access : ne correspond pas à l’objectif décrit\n• Privilege Escalation : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : Des identifiants d’administrateur sont extraits de la mémoire d’un poste. Quelle tactique ATT&CK ?","o":["Discovery","Credential Access","Defense Impairment","Stealth"],"ok":1,"ind":"« identifiants extraits de la mémoire ».","exp":"Vol d’identifiants en mémoire : Credential Access (T1003.001).","det":"Bonne réponse : Credential Access.\nBut de l’attaquant : Voler les mots de passe en mémoire pour en réutiliser les empreintes ailleurs.\nTechnique observée : T1003.001.\nComment le voir : Accès au processus LSASS par un outil non système, alertes EDR sur le vidage mémoire.\nComment l’empêcher : Protéger LSASS (Credential Guard), limiter les droits d’administration locale, EDR.\nPourquoi les autres réponses sont écartées :\n• Discovery : on ne regarde pas l’environnement, on vole.\n• Defense Impairment : ne correspond pas à l’objectif décrit\n• Stealth : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : Un exécutable est copié sur 50 serveurs via les partages d’administration. Quelle tactique ATT&CK ?","o":["Lateral Movement","Collection","Discovery","Execution"],"ok":0,"ind":"« copié sur 50 serveurs » : propagation d’une machine à plusieurs.","exp":"Propagation par les partages : Lateral Movement (T1021.002).","det":"Bonne réponse : Lateral Movement.\nBut de l’attaquant : Copier des outils sur de nombreuses machines via les partages d’administration.\nTechnique observée : T1021.002.\nComment le voir : Écritures sur les partages C$ et ADMIN$ depuis une machine inhabituelle, propagation en peu de temps.\nComment l’empêcher : Désactiver les partages inutiles, segmentation, pare-feu local, alerte sur les copies massives.\nPourquoi les autres réponses sont écartées :\n• Execution : on ne lance pas encore le code, on le dépose.\n• Discovery : ne correspond pas à l’objectif décrit\n• Collection : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : Les journaux d’événements de plusieurs serveurs sont effacés d’un coup, à 1 h du matin. Quelle tactique ATT&CK ?","o":["Privilege Escalation","Persistence","Stealth","Defense Impairment"],"ok":2,"ind":"« journaux effacés d’un coup » : effacer les traces.","exp":"Effacer les traces : Stealth (T1070.001, rattachement à vérifier dans la v19).","det":"Bonne réponse : Stealth.\nBut de l’attaquant : Effacer les journaux pour masquer ce qui s’est passé.\nTechnique observée : T1070.001.\nComment le voir : Journaux vidés ou arrêtés, événements d’effacement, journaux centralisés qui cessent.\nComment l’empêcher : Centralisation des journaux hors des machines, droits restreints, alertes sur l’effacement.\nPourquoi les autres réponses sont écartées :\n• Defense Impairment : on efface des traces, on ne désactive pas un outil de défense.\n• Privilege Escalation : ne correspond pas à l’objectif décrit\n• Persistence : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : Les copies de sauvegarde en ligne sont supprimées sur tous les serveurs. Quelle tactique ATT&CK ?","o":["Exfiltration","Command and Control","Defense Impairment","Impact"],"ok":3,"ind":"« copies de sauvegarde supprimées » : on détruit la capacité de se rétablir.","exp":"Empêcher la restauration : Impact (T1490).","det":"Bonne réponse : Impact.\nBut de l’attaquant : Rendre la restauration impossible pour forcer le paiement de la rançon.\nTechnique observée : T1490.\nComment le voir : Suppression de copies instantanées, arrêt des services de sauvegarde, commandes de suppression de sauvegardes.\nComment l’empêcher : Sauvegardes hors ligne et immuables, comptes de sauvegarde séparés, alertes sur toute suppression.\nPourquoi les autres réponses sont écartées :\n• Defense Impairment : on ne coupe pas un outil de sécurité, on détruit la récupération.\n• Exfiltration : ne correspond pas à l’objectif décrit\n• Command and Control : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : À 2 h 30, les fichiers de 50 serveurs sont chiffrés et une demande de rançon apparaît. Quelle tactique ATT&CK ?","o":["Collection","Command and Control","Impact","Exfiltration"],"ok":2,"ind":"« fichiers chiffrés et demande de rançon » : l’effet final.","exp":"Chiffrement par rançongiciel : Impact (T1486).","det":"Bonne réponse : Impact.\nBut de l’attaquant : Chiffrer les fichiers pour obtenir une rançon.\nTechnique observée : T1486.\nComment le voir : Renommages massifs de fichiers, forte activité disque, note de rançon, EDR.\nComment l’empêcher : Sauvegardes testées, segmentation, EDR avec blocage, plan de réponse à incident.\nPourquoi les autres réponses sont écartées :\n• Exfiltration : rien ne sort, tout est chiffré sur place.\n• Command and Control : ne correspond pas à l’objectif décrit\n• Collection : ne correspond pas à l’objectif décrit"}],"rap":{"t":"Rappel : Rançon en cascade","pg":"page 324","h":"<p>Rançongiciel précédé de l’arrêt des défenses et de l’effacement des traces. Une question par événement de l’attaque, dans l’ordre du récit.</p>"}}};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L='ABCDEF',WS='wss://cpro-relay.belmdeveloppement.workers.dev/ps',NTFY='https://ntfy.sh';
const rid=()=>Math.random().toString(36).slice(2,12),norm=s=>String(s).trim().toLowerCase();
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ================= Bus : relais Cloudflare (voie principale), ntfy en secours seulement ================= */
function Bus(room,onstat){
  const b={room,ws:null,up:false,subs:{},seen:new Set(),fails:0,sig:0,es:{},esOk:false,acks:{},ntfyAt:0,dead:false,onup:[]};
  const stat=()=>{try{onstat&&onstat()}catch(e){}};
  b.state=()=>MOCK||b.up?'ok':(b.esOk?'sec':'off');
  const deliver=(t,o,ts)=>{if(o&&o._u){if(b.seen.has(o._u))return;b.seen.add(o._u);if(b.seen.size>5000)b.seen.clear()}b.sig=Date.now();const s=b.subs[t];if(s)s.cb(o,ts)};
  function closeES(){Object.values(b.es).forEach(e=>{try{e.close()}catch(x){}});b.es={};b.esOk=false}
  function openES(){if(b.up||MOCK||b.dead)return;Object.keys(b.subs).forEach(t=>{if(b.es[t])return;
    const es=new EventSource(NTFY+'/'+t+'/sse?since='+(b.subs[t].nlast||'10m'));
    es.onopen=()=>{b.esOk=true;stat()};es.onerror=()=>{b.esOk=false;stat()};
    es.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}if(m.event&&m.event!=='message')return;if(m.id)b.subs[t].nlast=m.id;let o;try{o=JSON.parse(m.message)}catch(x){return}deliver(t,o,(m.time||0)*1000)};
    b.es[t]=es})}
  b.open=()=>{
    if(MOCK||b.dead||b.ws)return;
    let w;try{w=new WebSocket(WS+'?room='+encodeURIComponent(room))}catch(e){return setTimeout(b.open,3000)}
    b.ws=w;let ping=null,closed=false;
    w.onopen=()=>{b.up=true;b.fails=0;b.sig=Date.now();closeES();Object.keys(b.subs).forEach(t=>w.send(JSON.stringify({a:'sub',t,since:b.subs[t].last||0})));
      ping=setInterval(()=>{try{w.send('ping')}catch(e){}},25000);const q=b.onup.slice();q.forEach(f=>{try{f()}catch(e){}});stat()};
    w.onmessage=e=>{if(e.data==='pong'){b.sig=Date.now();return}let m;try{m=JSON.parse(e.data)}catch(x){return}
      if(m.a==='ack'){const k=b.acks[m.u];if(k){clearTimeout(k.t);delete b.acks[m.u];if(m.n===0)k.fb()}return}
      if(m.a!=='msg')return;const s=b.subs[m.t];if(!s)return;s.last=m.id;let o;try{o=JSON.parse(m.m)}catch(x){return}deliver(m.t,o,m.ts)};
    const end=()=>{if(closed)return;closed=true;clearInterval(ping);b.ws=null;b.up=false;b.fails++;stat();setTimeout(()=>{if(!b.up)openES()},4000);setTimeout(b.open,Math.min(15000,1000*Math.pow(2,Math.min(b.fails,4))))};
    w.onclose=end;w.onerror=end};
  if(MOCK){b.ch=new BroadcastChannel('qz-'+room);b.ch.onmessage=e=>{const m=e.data;let o;try{o=JSON.parse(m.m)}catch(x){return}deliver(m.t,o,Date.now())}}
  b.sub=(t,cb)=>{b.subs[t]={last:0,cb};if(b.up)b.ws.send(JSON.stringify({a:'sub',t,since:0}));else if(!MOCK){b.open();if(b.fails>0)openES()}};
  b.pub=(t,obj)=>{obj._u=rid();const body=JSON.stringify(obj);
    const post=()=>fetch(NTFY+'/'+t,{method:'POST',body}).catch(()=>{});
    const fb=()=>{const n=Date.now();if(n-b.ntfyAt<20000)return;b.ntfyAt=n;post()};  // ntfy ménagé : au plus 1 envoi / 20 s si le relais est joignable
    if(MOCK){b.ch.postMessage({t,m:body});return}
    if(b.up){const k={fb};k.t=setTimeout(()=>{delete b.acks[obj._u];fb()},2500);b.acks[obj._u]=k;try{b.ws.send(JSON.stringify({a:'pub',t,m:body,u:obj._u}));return}catch(e){clearTimeout(k.t);delete b.acks[obj._u]}}
    post()};
  b.resync=()=>{Object.keys(b.subs).forEach(t=>{b.subs[t].last=0;b.subs[t].nlast=null});
    if(MOCK)return;if(b.ws){try{b.ws.close()}catch(e){}}else b.open();closeES();setTimeout(()=>{if(!b.up)openES()},4000)};
  b.close=()=>{b.dead=true;try{b.ws&&b.ws.close()}catch(e){}closeES()};
  return b}

function onPers(m){if(m&&m.t==='mine'&&m.k===S.key&&(!m.s||m.s===S.sk)){Object.keys(m.ans||{}).forEach(i=>{S.conf[i]=true;if(S.ans[i]==null)S.ans[i]=m.ans[i]});lsSet(ansKey(),S.ans);if(S.st&&!(S.st.ph==='ask'&&S.st.ty==='m'))render()}}
function onState(s){if(!s||(S.st&&s.v<S.st.v))return;
  if(s.gen){const gk='qz_gen_'+S.code,old=lsGet(gk,null);if(old!==s.gen){try{Object.keys(localStorage).filter(x=>x.indexOf('qz_ans_'+S.code+'_')===0).forEach(x=>localStorage.removeItem(x))}catch(e){}lsSet(gk,s.gen);S.ans={};S.conf={};S.sk='';if(old!==null){S.sent=0;setTimeout(sendHello,300)}}}
if((s.k||'')!==S.sk){S.sk=s.k||'';S.ans=lsGet(ansKey(),{});S.conf={}}const nq=!S.st||S.st.i!==s.i;const same=S.st&&S.st.ph===s.ph&&S.st.i===s.i&&S.st.k===s.k&&s.ph==='ask'&&!!S.st.ind===!!s.ind;S.st=s;if(nq)S.sent=1;if(!same)render();if(MOD==='rap')openRap()}
function st(h){const s0=S.st,qb=s0&&(s0.ph==='ask'||s0.ph==='rev')&&s0.i>=0?qbn(s0.k,s0.i):'';A.innerHTML=qb+`<div class="row" style="justify-content:space-between"><b>${AVS[S.av]||''} ${esc(S.nom)}</b><span>${ctxBtns()} <span class="chip">code ${esc(S.code)}</span></span></div>`+h}
function render(){const s=S.st;if(!s)return st('<div class="card"><h2>Connexion en cours…</h2><p>En attente de l’animateur.</p></div>');
  if(s.ph==='lobby')return st('<div class="card"><h2>✓ Connecté</h2><p>Attendez la première question…</p></div>');
  if(s.ph==='ask')return qView();
  if(s.ph==='rev'&&s.ty==='r')return st(`<div class="ban n">Consultation terminée<small>${S.ans[s.i]!=null?'● Ressource consultée':'▲ Ressource non ouverte'}</small></div><div class="ex"><b>À retenir</b><br>${esc(s.exp||'')}</div>`);
  if(s.ph==='rev'&&s.ty==='m'){const a=S.ans[s.i]||[],n=s.L.length,p=ptsD(s.correct,a),sc=s.good.reduce((t,g,i)=>t+ptsD(g,S.ans[i]),0),nn=s.good.reduce((t,g)=>t+maxD(g),0);
    return st(`<div class="ban ${p===n?'g':p?'n':'r'}">${p===n?'✓ TOUT JUSTE':p?'⚠ PARTIEL':'✗ AUCUNE BONNE ASSOCIATION'}<small>${p} / ${n} bonnes associations</small></div><div class="card"><table><tr><th>Élément</th><th>Votre choix</th><th>Bonne réponse</th></tr>${s.L.map((l,j)=>`<tr><td>${esc(l)}</td><td>${a[j]===s.correct[j]?'✓':'✗'} ${a[j]==null?'–':esc(s.R[a[j]])}</td><td><b>${esc(s.R[s.correct[j]])}</b></td></tr>`).join('')}</table></div><div class="ex"><b>Explication</b><br>${esc(s.exp)}</div><p style="color:var(--m)">Score actuel : ${sc} / ${nn}</p>`)}
  if(s.ph==='rev'){const a=S.ans[s.i],ok=a===s.correct,sc=s.good.reduce((t,g,i)=>t+ptsD(g,S.ans[i]),0),nn=s.good.reduce((t,g)=>t+maxD(g),0);if(s.correct<0)return st(`<div class="ban n">${a==null?'– PAS DE RÉPONSE':'✓ RÉPONSE ENREGISTRÉE'}<small>Sondage : pas de bonne réponse</small></div><div class="ex"><b>Explication</b><br>${esc(s.exp)}</div>`);
    return st(`<div class="ban ${a==null?'n':ok?'g':'r'}">${a==null?'– PAS DE RÉPONSE':ok?'✓ BONNE RÉPONSE':'✗ MAUVAISE RÉPONSE'}<small>Bonne réponse : ${L[s.correct]}${s.o&&s.o[s.correct]?' · '+esc(s.o[s.correct]):''}</small></div><div class="ex"><b>Explication</b><br>${esc(s.exp)}</div><p style="color:var(--m)">Score actuel : ${sc} / ${nn}</p>`)}
  if(s.ph==='end'){const me=(s.res||[]).findIndex(x=>x.k===S.key),sc=s.good.reduce((t,g,i)=>t+ptsD(g,S.ans[i]),0),nn=s.good.reduce((t,g)=>t+maxD(g),0);
    return st(`<div class="ban n">Quiz terminé<small>Votre score : ${sc} / ${nn}${me>=0?' · rang '+(me+1)+' sur '+s.res.length:''}</small></div>`)}}
const dk=i=>S.sk+':'+i;
function dirty(i,q){const d=S.dr[dk(i)];if(d===undefined)return false;return JSON.stringify(d)!==JSON.stringify(S.ans[i]===undefined?null:S.ans[i])}
function valBtn(i,q){const dr=dirty(i,q),has=S.ans[i]!=null;return `<div class="row" style="margin-top:10px"><button id="vb" onclick="valider()" ${dr?'':'disabled'}>Valider</button><span id="vs" style="color:var(--m)">${dr?'▲ Choix non validé : appuyez sur Valider (ou Entrée).':has?(S.conf[i]?'✓ Réponse validée et reçue par l’animateur.':'● Réponse validée, envoi en cours…'):'Choisissez, puis validez.'} Modifiable jusqu’à la correction.</span></div>`}
function qViewR(){const q=S.st,got=S.ans[q.i]!=null;
  st(`<div class="q" style="font-size:24px">${esc(q.q)}</div>`+(q.R||[]).map((r,j)=>`<div class="card" style="${j===q.rs?'border:3px solid var(--y)':''}"><b>${j===q.rs?'▶ Projeté : ':''}${esc(r.t)}</b> <span class="chip">${esc(r.k)}</span><p><a href="${esc(r.u)}" target="_blank" rel="noopener noreferrer"><button type="button" onclick="seenR()">Ouvrir (nouvel onglet)</button></a></p></div>`).join('')+`<p style="color:var(--m)">${got?'✓ Consultation enregistrée.':'Ouvrez la ressource, puis appuyez sur Valider.'}</p><div class="row"><button onclick="seenR()" ${got?'disabled':''}>Valider : j’ai consulté</button></div>`)}
function seenR(){const i=S.st.i;S.ans[i]=1;S.conf[i]=false;lsSet(ansKey(),S.ans);send(i,1)}
function qViewM(){const q=S.st,i=q.i,d=S.dr[dk(i)],a=(d!==undefined?d:S.ans[i])||q.L.map(()=>null);
  st(`<div class="pb"><i style="width:${100*a.filter(x=>x!=null).length/q.L.length}%"></i></div><div style="color:var(--m)">Associez chaque élément à un terme</div><div class="q" style="font-size:24px">${esc(q.q)}</div>`+
  q.L.map((l,j)=>`<div class="card"><div style="margin-bottom:8px"><b>${j+1}.</b> ${esc(l)}</div><select aria-label="Terme pour l’élément ${j+1}" onchange="pickM(${j},this.value)"><option value="">— choisir un terme —</option>${q.R.map((r,k)=>`<option value="${k}" ${a[j]===k?'selected':''}>${esc(r)}</option>`).join('')}</select></div>`).join('')+
  (q.ind?`<div class="hint"><b>Indice</b> : ${esc(q.ind)}</div>`:'')+valBtn(i,q))}
function pickM(j,v){const q=S.st,i=q.i,a=((S.dr[dk(i)]!==undefined?S.dr[dk(i)]:S.ans[i])||q.L.map(()=>null)).slice();a[j]=v===''?null:+v;S.dr[dk(i)]=a;
  const b=document.getElementById('vb'),t=document.getElementById('vs');if(b)b.disabled=!dirty(i,q);if(t)t.textContent=dirty(i,q)?'▲ Choix non validé : appuyez sur Valider (ou Entrée). '+a.filter(x=>x!=null).length+' / '+q.L.length+' choisis.':'Réponse inchangée.'}
function qView(){if(S.st.ty==='r')return qViewR();if(S.st.ty==='m')return qViewM();const q=S.st,i=q.i,d=S.dr[dk(i)],sel=d!==undefined?d:S.ans[i];
  st(`<div class="pb"><i style="width:${S.ans[i]!=null?100:0}%"></i></div><div style="color:var(--m)">Touches A à ${L[q.o.length-1]} pour choisir, Entrée pour valider</div><div class="q" style="font-size:24px">${esc(q.q)}</div>`+
  q.o.map((o,k)=>`<button class="opt ${sel===k?'sel':''}" onclick="pick(${k})"><div class="lt">${L[k]}</div><div class="tx">${sel===k?'● ':''}${esc(o)}${S.ans[i]===k&&!dirty(i,q)?' <span class="chip">✓ validée</span>':''}</div></button>`).join('')+
  (q.ind?`<div class="hint"><b>Indice</b> : ${esc(q.ind)}</div>`:'')+valBtn(i,q))}
function pick(k){const i=S.st.i;S.dr[dk(i)]=k;qView()}
function valider(){const q=S.st;if(!q||q.ph!=='ask')return;const i=q.i,d=S.dr[dk(i)];if(d===undefined||!dirty(i,q))return;S.ans[i]=d;delete S.dr[dk(i)];S.conf[i]=false;lsSet(ansKey(),S.ans);send(i,d);qView();
  setTimeout(()=>{if(!S.conf[i]&&S.st&&S.st.i===i&&S.st.ph==='ask')send(i,S.ans[i])},4000)}
function send(i,a){C.pub('qz'+S.code+'u',{t:'ans',nom:S.nom,av:S.av,s:S.sk,q:i,a,dev:isTel()?'tel':'pc'})}
home();rpBus();setTimeout(flushReports,3000);
</script></body></html>
