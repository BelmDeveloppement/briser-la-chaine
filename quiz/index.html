<style>
/* Palette accessible (daltonisme rouge-vert) : bleu = bon / actif, orange = problème, jaune = attention. Toujours un mot ou un symbole en plus. */
:root{--bg:#0B1730;--p:#13264A;--t:#EAF1FF;--m:#B4C6EA;--ok:#56B4E9;--bad:#FF8A3D;--y:#F0E442;--ln:#3a5a99;--dk:#04121f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,Segoe UI,sans-serif;min-height:100vh}
.w{max-width:1100px;margin:0 auto;padding:16px}h1{margin:0;font-size:28px}h1 b{color:var(--y)}h2{margin:.2em 0}
.card{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:16px;margin:12px 0}

button.s{background:#2a4a85;color:var(--t)}button.sm{padding:6px 10px;font-size:14px}button:disabled{opacity:.4;cursor:default}

input,select,textarea{font-size:18px;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--t);width:100%;font-family:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tm{font-size:56px;font-weight:800}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:#2a4a85;margin:2px}

.opt{display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;background:var(--bg);border:2px solid var(--ln);border-radius:12px;margin:10px 0;padding:12px 14px;font-size:22px;font-weight:600;text-align:left;width:100%;color:var(--t)}
.opt .bar{position:absolute;left:0;top:0;bottom:0;background:#2f5fb8;opacity:.55;width:0;transition:width .5s}
.opt .lt{z-index:1;min-width:36px;height:36px;border-radius:50%;background:#2a4a85;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.opt .tx{z-index:1;flex:1}.opt .n{z-index:1;font-size:26px;font-weight:900}
.opt.good{border:4px solid var(--ok)}.opt.good .bar{background:var(--ok);opacity:.45}.opt.bad{opacity:.6;border-style:dashed}
.opt.sel{border-color:var(--y);background:#2a3d6e}
.ban{border-radius:14px;padding:18px 12px;text-align:center;font-size:30px;font-weight:900;letter-spacing:1px;margin:12px 0;color:var(--dk)}
.ban.g{background:var(--ok)}.ban.r{background:var(--bad)}.ban.n{background:#2a4a85;color:#fff}.ban small{display:block;font-size:15px;font-weight:600;letter-spacing:0;margin-top:4px}
.ex{border-left:4px solid var(--ok);padding:4px 12px;margin:10px 0;font-size:18px}
.hint{border-left:4px solid var(--y);padding:4px 12px;margin:10px 0;font-size:18px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:center;border-bottom:1px solid var(--ln)}td:first-child,th:first-child{text-align:left}
.mk{font-size:22px;font-weight:900}.mk.g{color:var(--ok)}.mk.r{color:var(--bad)}.mk.n{color:#9db0d8}
.pb{height:8px;background:#2a4a85;border-radius:6px;margin:6px 0 12px}.pb i{display:block;height:8px;background:var(--y);border-radius:6px}

#bar input{width:90px;font-size:14px;padding:6px}
.bd{font-weight:800;padding:2px 8px;border-radius:8px;border:2px solid}.bd.ok{border-color:var(--ok);color:var(--ok)}.bd.sec{border-color:var(--y);color:var(--y)}.bd.off{border-color:var(--bad);color:var(--bad)}.bd.na{border-color:#6b7fa8;color:#9db0d8}
.big{font-size:22px}.url{font-size:24px;font-weight:800;word-break:break-all;color:var(--y)}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}.modal>div{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto}
label{display:block;margin:8px 0 4px;color:var(--m)}
.qbn{position:sticky;top:38px;z-index:4;background:var(--y);color:var(--dk);font-weight:900;border-radius:10px;padding:8px 14px;margin:8px 0;font-size:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.qbn small{font-weight:700;font-size:14px}.qbn.big{font-size:30px}
.rk{display:flex;align-items:center;gap:10px;margin:8px 0}.rk .no{min-width:34px;height:34px;border-radius:50%;background:#2a4a85;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}.rk .av{font-size:30px;flex:none}.rk .nm{min-width:90px;font-weight:700;flex:none;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk .pbar{flex:1;height:22px;background:#2a4a85;border-radius:12px;overflow:hidden}.rk .pbar i{display:block;height:100%;background:var(--ok);border-radius:12px;transition:width .6s}.rk b{min-width:64px;text-align:right}
.avs{display:flex;gap:8px;flex-wrap:wrap}.avs button{font-size:28px;padding:6px 10px;background:#2a4a85}.avs button.on{outline:4px solid var(--y);background:#2a3d6e}
.rp h3{margin:.8em 0 .2em;color:var(--y)}.rp ul,.rp ol{margin:.2em 0;padding-left:24px}.rp table{margin:6px 0}.rp td,.rp th{text-align:left;font-size:15px}.rp.big td,.rp.big th{font-size:22px}.rp.big li,.rp.big p{font-size:24px}.rp small{color:var(--m)}.st{display:inline-block;padding:1px 8px;border-radius:8px;border:2px solid;font-weight:800;font-size:13px}.st.a{border-color:var(--y);color:var(--y)}.st.o{border-color:var(--ok);color:var(--ok)}.st.r{border-color:var(--bad);color:var(--bad)}.st.t{border-color:#9db0d8;color:#9db0d8}

<script>
const SETS={"atk":{"titre":"QCM ATT&CK","qs":[{"q":"Dans son rapport sur TransLor, un prestataire écrit : « l’attaquant voulait voler des identifiants ». Dans ATT&CK, cette phrase décrit…","o":["une mitigation (une mesure défensive)","une technique (le « comment » précis)","une procédure (l’outil et la commande réellement lancés)","une tactique (le « pourquoi » de l’attaquant)"],"ok":3,"ind":"","exp":"La tactique est l’objectif de l’attaquant à un moment donné (ici Credential Access) ; la technique dit comment, la procédure détaille l’outil.","det":"Bonne réponse : une tactique.\n« Voler des identifiants » est un but : c’est la tactique Credential Access (TA0006).\nPourquoi les autres réponses sont écartées :\n• une technique : elle décrit la manière, par exemple T1003 OS Credential Dumping\n• une procédure : elle nomme l’outil ou la commande réellement utilisés, par exemple Mimikatz\n• une mitigation : c’est une mesure de défense (identifiant M…), pas un comportement d’attaquant\nÀ dire à l’oral : Faire redire la phrase « pourquoi / comment / avec quoi » : tactique, technique, procédure."},{"q":"Sur un serveur de TransLor, un attaquant lit la mémoire du processus LSASS pour récupérer des mots de passe. Quelle sous-technique ?","o":["T1059.001 (PowerShell)","T1003.001 (LSASS Memory)","T1003.003 (NTDS)","T1003.002 (Security Account Manager)"],"ok":1,"ind":"","exp":"T1003 OS Credential Dumping a plusieurs sous-techniques : .001 LSASS Memory, .002 base SAM, .003 base NTDS d’Active Directory.","det":"Bonne réponse : T1003.001.\nLSASS (Local Security Authority Subsystem Service) garde en mémoire les identifiants des sessions ouvertes.\nPourquoi les autres réponses sont écartées :\n• T1003.002 : la base SAM contient les comptes locaux, pas la mémoire de LSASS\n• T1003.003 : NTDS.dit est la base Active Directory, sur un contrôleur de domaine\n• T1059.001 : PowerShell est un interpréteur : il peut lancer l’attaque mais ne vole pas lui-même les identifiants"},{"q":"Le prestataire de supervision de TransLor veut savoir quelles attaques ses règles de détection couvrent. Quel usage d’ATT&CK ?","o":["rattacher chaque règle à une technique et colorer les trous dans un layer","remplacer son scan de vulnérabilités par la matrice","lister les correctifs appliqués sur chaque poste","calculer un score CVSS pour chaque règle"],"ok":0,"ind":"","exp":"On associe chaque règle ou alerte à une technique pour voir les trous de couverture dans Navigator.","det":"Bonne réponse : rattacher chaque règle à une technique et colorer les trous.\nC’est l’usage « couverture » d’ATT&CK : une règle par technique, couleur selon le niveau de détection.\nPourquoi les autres réponses sont écartées :\n• remplacer le scan de vulnérabilités : ATT&CK décrit des comportements d’attaquants, pas des failles à corriger\n• score CVSS par règle : le CVSS note la gravité d’une vulnérabilité, pas une règle de détection\n• lister les correctifs : c’est de la gestion de parc et de correctifs, sans lien avec les techniques"},{"q":"« T1566 Phishing » et « T1566.001 Spearphishing Attachment » : quelle relation ?","o":["T1566.001 est la version récente qui remplace T1566","T1566 est une sous-technique de T1566.001","T1566.001 est une tactique plus fine que T1566","T1566.001 est une façon précise de réaliser T1566 (sous-technique)"],"ok":3,"ind":"","exp":"Une sous-technique est une variante précise d’une technique : on retrouve le même numéro de base avec un suffixe .001.","det":"Bonne réponse : T1566.001 est une sous-technique de T1566.\nLe suffixe .001 précise la technique : ici le hameçonnage avec pièce jointe.\nPourquoi les autres réponses sont écartées :\n• tactique plus fine : une tactique porte un identifiant TA…, jamais T…\n• T1566 sous-technique de T1566.001 : c’est l’inverse : la sous-technique est la plus précise\n• remplacement : les deux coexistent : la technique reste valable, la sous-technique la détaille"},{"q":"TransLor veut visualiser la matrice, colorer les techniques détectées et enregistrer le résultat dans un fichier. Quel outil ?","o":["Nessus","Microsoft Threat Modeling Tool","ATT&CK Navigator","Nmap"],"ok":2,"ind":"","exp":"Navigator crée des layers (couleurs, scores, commentaires) enregistrés en JSON.","det":"Bonne réponse : ATT&CK Navigator.\nC’est l’outil officiel pour afficher la matrice et annoter des techniques.\nPourquoi les autres réponses sont écartées :\n• Nmap : scanne des ports et des machines\n• Nessus : recherche des vulnérabilités sur des systèmes\n• Microsoft Threat Modeling Tool : dessine un schéma de flux (DFD) et propose des menaces STRIDE, sans matrice ATT&CK"}]},"final":{"titre":"QCM final du module","qs":[{"q":"Chez TransLor, un attaquant passe d’un serveur à l’autre avec un compte volé. Quelle tactique ATT&CK ?","o":["Persistence","Lateral Movement","Privilege Escalation","Credential Access"],"ok":1,"ind":"","exp":"Se déplacer d’un système à un autre est le Lateral Movement (TA0008).","det":"Bonne réponse : Lateral Movement.\nLe but est d’atteindre d’autres machines depuis un accès déjà obtenu.\nPourquoi les autres réponses sont écartées :\n• Privilege Escalation : obtenir plus de droits sur la même machine\n• Persistence : rester présent après un redémarrage\n• Credential Access : voler les identifiants : c’était l’étape précédente"},{"q":"Dans STRIDE, la lettre R (Repudiation) correspond à la violation de quelle propriété ?","o":["la non-répudiation","l’authenticité","la disponibilité","l’intégrité"],"ok":0,"ind":"","exp":"Repudiation ↔ non-répudiation : on peut nier avoir fait une action faute de preuve.","det":"Bonne réponse : la non-répudiation.\nLa répudiation permet de nier une action (un virement validé, une suppression) faute de journal fiable.\nPourquoi les autres réponses sont écartées :\n• l’intégrité : c’est le T de STRIDE (Tampering)\n• l’authenticité : c’est le S (Spoofing)\n• la disponibilité : c’est le D (Denial of service)"},{"q":"Dans l’arbre d’attaque de la fraude chez TransLor, deux voies mènent au nœud « accéder au TMS » (nœud OU). Quel est le coût de ce nœud ?","o":["le maximum des coûts de ses enfants","le minimum des coûts de ses enfants","la somme des coûts de ses enfants","le coût de la première voie dessinée"],"ok":1,"ind":"","exp":"L’attaquant prend la voie la moins chère : minimum. Pour un nœud ET, on additionne.","det":"Bonne réponse : le minimum.\nUn nœud OU est atteint par la voie la moins coûteuse : on prend le plus petit coût.\nPourquoi les autres réponses sont écartées :\n• la somme : c’est le calcul d’un nœud ET, où tout est nécessaire\n• le maximum : l’attaquant n’a aucune raison de choisir la voie la plus chère\n• la première voie dessinée : l’ordre du dessin n’a aucun effet sur le coût"},{"q":"L’équipe de TransLor veut savoir si une CVE de son Exchange est déjà exploitée dans la nature. Quelle source consulter ?","o":["l’identifiant CWE de la faille","le score EPSS de la CVE","le score CVSS de la CVE","le catalogue KEV de la CISA"],"ok":3,"ind":"","exp":"Le catalogue KEV (Known Exploited Vulnerabilities) recense les CVE dont l’exploitation est avérée.","det":"Bonne réponse : le catalogue KEV.\nIl liste les failles dont l’exploitation est constatée.\nPourquoi les autres réponses sont écartées :\n• CVSS : note la gravité technique, pas l’exploitation réelle\n• EPSS : estime la probabilité d’exploitation future : une prévision, pas un constat\n• CWE : classe le type de faiblesse"},{"q":"TransLor veut structurer l’analyse de ses risques cyber. Quelle norme donne les lignes directrices de gestion des risques de sécurité de l’information ?","o":["ISO/IEC 27035 (gestion des incidents)","ISO/IEC 27001 (exigences du SMSI)","ISO/IEC 27005","ISO/IEC 27002 (catalogue de mesures)"],"ok":2,"ind":"","exp":"27001 = exigences du SMSI, 27002 = catalogue de mesures, 27005 = gestion des risques.","det":"Bonne réponse : ISO/IEC 27005.\nElle décrit la démarche d’appréciation et de traitement des risques.\nPourquoi les autres réponses sont écartées :\n• 27001 : fixe les exigences du système de management\n• 27002 : propose les mesures de sécurité\n• 27035 : traite la réponse aux incidents"}]},"j1":{"titre":"Rappel du jour 1","qs":[{"q":"Pour modéliser les menaces du portail client de TransLor, dans quel ordre procède-t-on ?","o":["Menaces, actifs, risques, cartographie, mesures","Cartographie, mesures, actifs, menaces, risques","Actifs, cartographie du système, menaces, risques, mesures","Risques, menaces, actifs, mesures, cartographie"],"ok":2,"ind":"","exp":"On ne peut pas chercher des menaces avant de savoir ce que l’on protège et comment le système est construit.","det":"Bonne réponse : Actifs, cartographie, menaces, risques, mesures.\nChaque étape nourrit la suivante : ce qu’on protège, comment c’est construit, ce qui peut arriver, quel risque, quelle réponse.\nPourquoi les autres réponses sont écartées :\n• Menaces en premier : sans actifs, on ne sait pas quoi menacer\n• Mesures en deuxième : on ne choisit pas de réponse avant d’avoir mesuré le risque\n• Risques en premier : un risque est le produit d’une menace et d’un impact : il vient après"},{"q":"Un attaquant se fait passer pour un transporteur partenaire sur le portail de TransLor. Quelle lettre de STRIDE et quelle propriété ?","o":["S, Spoofing : l’authenticité","T, Tampering : l’intégrité","R, Repudiation : la non-répudiation","I, Information disclosure : la confidentialité"],"ok":0,"ind":"","exp":"Spoofing = usurpation d’identité ; la propriété visée est l’authenticité.","det":"Bonne réponse : S, Spoofing : l’authenticité.\nL’attaquant prétend être quelqu’un d’autre.\nPourquoi les autres réponses sont écartées :\n• Tampering : modifier une donnée\n• Information disclosure : exposer une donnée à qui n’a pas à la lire\n• Repudiation : nier avoir agi"},{"q":"L’équipe de TransLor applique la méthode PASTA. Combien d’étapes compte-t-elle ?","o":["douze","cinq","neuf","sept"],"ok":3,"ind":"","exp":"PASTA compte sept étapes, des objectifs métier jusqu’à l’analyse du risque et des contre-mesures.","det":"Bonne réponse : sept.\nObjectifs, périmètre, décomposition, menaces, vulnérabilités, attaques, risques.\nPourquoi les autres réponses sont écartées :\n• cinq : c’est le nombre d’étapes de la modélisation générale du jour 1\n• neuf : ne correspond à aucune méthode du cours\n• douze : ce sont les actions du scénario de la page 176, sans lien avec PASTA"},{"q":"Le directeur de TransLor veut vérifier qui peut lire, créer, modifier ou supprimer quelles données (RIB, tournées). Quelle méthode ?","o":["STRIDE","TRIKE","PASTA","DREAD"],"ok":1,"ind":"","exp":"TRIKE est centrée sur les droits : matrice acteurs, actifs, actions.","det":"Bonne réponse : TRIKE.\nSa matrice acteurs × actifs × actions compare les droits voulus et les droits réels.\nPourquoi les autres réponses sont écartées :\n• STRIDE : classe les menaces par catégorie, sans matrice de droits\n• DREAD : note la gravité d’une menace\n• PASTA : déroule une analyse en sept étapes à partir du métier"},{"q":"Quelle association de méthodes relie le mieux les scénarios d’attaque de TransLor aux techniques ATT&CK ?","o":["PASTA (scénarios) avec les arbres d’attaque (chemins)","aucune : ATT&CK remplace toutes les autres méthodes","DREAD seule pour noter chaque technique","TRIKE seule pour lister les droits"],"ok":0,"ind":"","exp":"PASTA (scénarios) et les arbres d’attaque (chemins chiffrés) se rattachent aux techniques ATT&CK ; STRIDE catégorise les menaces.","det":"Bonne réponse : PASTA avec les arbres d’attaque.\nPASTA écrit les scénarios, l’arbre trace les chemins ; chaque étape se rattache à une technique ATT&CK.\nPourquoi les autres réponses sont écartées :\n• DREAD seule : elle note, mais ne décrit pas de chemin\n• TRIKE seule : elle traite les droits, pas la suite d’actions de l’attaquant\n• ATT&CK remplace tout : ATT&CK décrit des comportements ; il ne remplace pas une démarche d’analyse"}]},"surface":{"titre":"QCM surface d’attaque","qs":[{"q":"Quelle est la définition de la surface d’attaque de TransLor ?","o":["la liste de ses pare-feu","le nombre de salariés ayant un accès","une faille précise dans le TMS","l’ensemble des points d’entrée exploitables de ses systèmes"],"ok":3,"ind":"","exp":"La surface est l’ensemble des points d’entrée. Une faille est une vulnérabilité ; un pare-feu est un élément de défense.","det":"Bonne réponse : l’ensemble des points d’entrée exploitables.\nLa surface regroupe tous les chemins qu’une menace peut emprunter.\nPourquoi les autres réponses sont écartées :\n• une faille précise : c’est une vulnérabilité, un élément de la surface\n• la liste de ses pare-feu : ce sont des défenses, pas des entrées\n• le nombre de salariés : il compte dans la surface humaine, mais n’en est pas la définition"},{"q":"Un faux courriel de « fournisseur » vise la comptabilité de TransLor. Quelle surface d’attaque est exploitée ?","o":["la surface humaine","la surface physique","la surface réseau","la surface applicative"],"ok":0,"ind":"","exp":"Le phishing vise l’utilisateur, pas le réseau : surface humaine.","det":"Bonne réponse : la surface humaine.\nLa cible est la personne qui ouvre ou clique.\nPourquoi les autres réponses sont écartées :\n• réseau : aucun port ni protocole n’est attaqué\n• physique : aucun accès aux locaux n’est nécessaire\n• applicative : aucune faille du logiciel n’est exploitée"},{"q":"Quelle action réduit le plus la surface d’attaque de TransLor ?","o":["ouvrir le VPN à tous les partenaires","reporter les mises à jour d’Exchange","désactiver les 12 comptes d’anciens salariés encore actifs","ajouter un service de suivi accessible depuis Internet"],"ok":2,"ind":"","exp":"Supprimer un accès inutile retire un point d’entrée ; les trois autres en ajoutent.","det":"Bonne réponse : désactiver les 12 comptes.\nChaque compte inutile est une porte d’entrée en moins.\nPourquoi les autres réponses sont écartées :\n• ouvrir le VPN : ajoute des entrées\n• reporter les mises à jour : laisse des failles connues\n• ajouter un service exposé : crée une nouvelle entrée"},{"q":"Si le TMS de TransLor embarquait un composant comme Apache Struts (faille d’Equifax, 2017), de quelle surface relèverait la faille ?","o":["la surface humaine","la surface logicielle","la surface organisationnelle","la surface physique"],"ok":1,"ind":"","exp":"Un composant tiers non corrigé : surface logicielle.","det":"Bonne réponse : la surface logicielle.\nLa faiblesse est dans le code d’un composant, exploitable à distance.\nPourquoi les autres réponses sont écartées :\n• physique : aucun accès aux locaux\n• humaine : aucune personne n’est piégée\n• organisationnelle : le retard de correctif y contribue, mais la faille elle-même est logicielle"},{"q":"Le technicien de TransLor veut scanner lui-même les ports ouverts de son pare-feu. Quel outil ?","o":["Wireshark","OWASP ZAP","Nmap","Shodan"],"ok":2,"ind":"","exp":"Nmap scanne les ports. ZAP teste des applications web ; Shodan interroge un index existant ; Wireshark capture du trafic.","det":"Bonne réponse : Nmap.\nC’est le scanner de ports de référence.\nPourquoi les autres réponses sont écartées :\n• OWASP ZAP : teste des applications web\n• Shodan : interroge un index existant : vous ne scannez pas vous-même\n• Wireshark : analyse du trafic capturé"}],"rap":{"t":"Rappel : la surface d’attaque","pg":"pages 55 et 59","h":"<p>Ensemble des points d’entrée, vecteurs ou interfaces par lesquels un attaquant peut tenter de compromettre un système.</p><table><tr><th>Type</th><th>Exemples d’éléments</th><th>Risques</th></tr><tr><td>Physique</td><td>serveurs, routeurs, clés USB</td><td>vol, sabotage, accès non autorisé</td></tr><tr><td>Réseau</td><td>ports ouverts, protocoles exposés</td><td>scan de ports, DDoS, interception</td></tr><tr><td>Applicative</td><td>interfaces web, API, formulaires</td><td>injection SQL, XSS, CSRF</td></tr><tr><td>Humaine</td><td>ingénierie sociale, phishing, erreurs</td><td>divulgation involontaire, clics malveillants</td></tr><tr><td>Logicielle</td><td>bibliothèques, dépendances tierces</td><td>vulnérabilités connues non corrigées</td></tr></table>"}},"ident":{"titre":"Flash : type d’identifiant ATT&CK","qs":[{"q":"Le rapport d’incident de TransLor cite l’identifiant TA0001. Il désigne…","o":["une tactique","une technique","une campagne","une mitigation"],"ok":0,"ind":"","exp":"Le préfixe TA désigne une tactique (TA0001 = Initial Access).","det":"Bonne réponse : une tactique.\nLe préfixe TA désigne une tactique (TA0001 = Initial Access).\nPourquoi les autres réponses sont écartées :\n• une technique : ce préfixe ne correspond pas à cet identifiant\n• une mitigation : ce préfixe ne correspond pas à cet identifiant\n• une campagne : ce préfixe ne correspond pas à cet identifiant"},{"q":"Le rapport d’incident de TransLor cite l’identifiant T1059. Il désigne…","o":["une tactique","une sous-technique","un logiciel","une technique"],"ok":3,"ind":"","exp":"T1059 = Command and Scripting Interpreter : une technique (T suivi de quatre chiffres).","det":"Bonne réponse : une technique.\nT1059 = Command and Scripting Interpreter : une technique (T suivi de quatre chiffres).\nPourquoi les autres réponses sont écartées :\n• une tactique : ce préfixe ne correspond pas à cet identifiant\n• une sous-technique : ce préfixe ne correspond pas à cet identifiant\n• un logiciel : ce préfixe ne correspond pas à cet identifiant"},{"q":"Le rapport d’incident de TransLor cite l’identifiant T1059.001. Il désigne…","o":["une campagne","une technique","une sous-technique","un groupe"],"ok":2,"ind":"","exp":"Le « .001 » précise la technique : PowerShell. C’est une sous-technique.","det":"Bonne réponse : une sous-technique.\nLe « .001 » précise la technique : PowerShell. C’est une sous-technique.\nPourquoi les autres réponses sont écartées :\n• une technique : ce préfixe ne correspond pas à cet identifiant\n• un groupe : ce préfixe ne correspond pas à cet identifiant\n• une campagne : ce préfixe ne correspond pas à cet identifiant"},{"q":"Le rapport d’incident de TransLor cite l’identifiant G0016. Il désigne…","o":["une campagne","une mesure défensive","un logiciel malveillant","un groupe d’attaquants"],"ok":3,"ind":"","exp":"G = groupe (G0016 = APT29).","det":"Bonne réponse : un groupe d’attaquants.\nG = groupe (G0016 = APT29).\nPourquoi les autres réponses sont écartées :\n• une mesure défensive : ce préfixe ne correspond pas à cet identifiant\n• un logiciel malveillant : ce préfixe ne correspond pas à cet identifiant\n• une campagne : ce préfixe ne correspond pas à cet identifiant"},{"q":"Le rapport d’incident de TransLor cite l’identifiant M1032. Il désigne…","o":["un logiciel","une mitigation (mesure défensive)","une technique","un groupe"],"ok":1,"ind":"","exp":"M = mitigation (M1032 = Multi-factor Authentication).","det":"Bonne réponse : une mitigation (mesure défensive).\nM = mitigation (M1032 = Multi-factor Authentication).\nPourquoi les autres réponses sont écartées :\n• un groupe : ce préfixe ne correspond pas à cet identifiant\n• une technique : ce préfixe ne correspond pas à cet identifiant\n• un logiciel : ce préfixe ne correspond pas à cet identifiant"}],"rap":{"t":"Rappel : lire un identifiant ATT&CK","pg":"page 178","h":"<table><tr><th>Préfixe</th><th>Objet</th></tr><tr><td>TA</td><td>Tactique</td></tr><tr><td>T</td><td>Technique</td></tr><tr><td>T…xxx</td><td>Sous-technique</td></tr><tr><td>G</td><td>Groupe d’attaquants</td></tr><tr><td>S</td><td>Logiciel (malware ou outil)</td></tr><tr><td>M</td><td>Mitigation (mesure défensive)</td></tr><tr><td>C</td><td>Campagne</td></tr><tr><td>DET / AN</td><td>Stratégie de détection / analytique (depuis la v18)</td></tr></table>"}},"dict":{"titre":"Flash : CVE, CWE, CAPEC ou ATT&CK ?","qs":[{"q":"Dossier d’incident TransLor : une faille précise dans une version d’Apache Log4j correspond à…","o":["une CVE","une technique ATT&CK","un CAPEC","une CWE"],"ok":0,"ind":"","exp":"CVE-2021-44228 : une vulnérabilité précise dans un produit.","det":"Bonne réponse : une CVE.\nUn identifiant unique pour une faille précise d’un produit.\nPourquoi les autres réponses sont écartées :\n• CWE : le type de faiblesse, pas la faille d’un produit\n• CAPEC : un schéma d’attaque\n• ATT&CK : un comportement d’attaquant"},{"q":"Dossier d’incident TransLor : le type de faiblesse « injection d’expression » correspond à…","o":["un CAPEC","une CVE","une technique ATT&CK","une CWE"],"ok":3,"ind":"","exp":"CWE-917 : le type de faiblesse.","det":"Bonne réponse : une CWE.\nElle classe la famille de faiblesse, indépendamment du produit.\nPourquoi les autres réponses sont écartées :\n• CVE : une faille précise dans un produit\n• CAPEC : la manière d’exploiter\n• ATT&CK : le comportement observé"},{"q":"Dossier d’incident TransLor : le schéma d’attaque qui exploite ce type de faiblesse correspond à…","o":["une CWE","un CAPEC","une technique ATT&CK","une CVE"],"ok":1,"ind":"","exp":"CAPEC-242 : la manière d’exploiter la faiblesse.","det":"Bonne réponse : un CAPEC.\nIl décrit comment l’attaquant exploite une faiblesse.\nPourquoi les autres réponses sont écartées :\n• CVE : faille précise\n• CWE : type de faiblesse\n• ATT&CK : comportement observé, rattaché à une tactique"},{"q":"Dossier d’incident TransLor : « T1190, Exploit Public-Facing Application » appartient à…","o":["CVE","CWE","ATT&CK","CAPEC"],"ok":2,"ind":"","exp":"ATT&CK décrit le comportement observé de l’attaquant, rattaché à une tactique (ici Initial Access).","det":"Bonne réponse : ATT&CK.\nLe préfixe T désigne une technique ATT&CK.\nPourquoi les autres réponses sont écartées :\n• CVE : identifie une faille précise\n• CWE : un type de faiblesse\n• CAPEC : un schéma d’attaque"}]},"stride":{"titre":"Flash STRIDE","qs":[{"q":"Un employé modifie en base l’IBAN d’un fournisseur de TransLor pour détourner un virement. Quelle catégorie STRIDE ?","o":["Spoofing","Information disclosure","Tampering","Repudiation"],"ok":2,"ind":"","exp":"Tampering (altération) : la donnée est modifiée sans droit, donc l’intégrité est violée. Mesures : contrôle d’accès, validation des entrées, contrôle d’intégrité.","det":"Bonne réponse : Tampering.\nLa donnée (l’IBAN) est modifiée sans droit.\nPourquoi les autres réponses sont écartées :\n• Spoofing : il ne se fait pas passer pour un autre\n• Repudiation : le sujet n’est pas la preuve\n• Information disclosure : rien n’est révélé, tout est modifié"},{"q":"Un administrateur partagé efface les journaux de TransLor : personne ne peut prouver qui a agi. Quelle catégorie ?","o":["Information disclosure","Repudiation","Denial of service","Spoofing"],"ok":1,"ind":"","exp":"Repudiation (répudiation) : on ne peut plus établir qui a fait quoi. Mesure : journalisation centralisée et inaltérable, horodatage fiable.","det":"Bonne réponse : Repudiation.\nOn perd la preuve de qui a fait quoi.\nPourquoi les autres réponses sont écartées :\n• Information disclosure : aucune donnée n’est exposée\n• Denial of service : le service reste disponible\n• Spoofing : l’identité n’est pas usurpée : le compte est partagé"},{"q":"Quelle mesure répond le mieux à une saturation volontaire du portail de suivi des colis de TransLor ?","o":["journalisation signée","authentification multifacteur","limitation de débit et protection anti-DDoS","chiffrement TLS"],"ok":2,"ind":"","exp":"Denial of service : on protège la disponibilité avec des quotas, du rate limiting et de l’anti-DDoS.","det":"Bonne réponse : limitation de débit et anti-DDoS.\nLa saturation vise la disponibilité : on filtre le trafic excessif.\nPourquoi les autres réponses sont écartées :\n• MFA : répond au spoofing\n• TLS : répond à l’information disclosure\n• journalisation signée : répond à la répudiation"}],"rap":{"t":"Rappel : les six catégories STRIDE","pg":"page 81","h":"<table><tr><th>Lettre</th><th>Menace</th><th>Propriété violée</th><th>Définition</th></tr><tr><td>S</td><td>Spoofing (usurpation)</td><td>Authenticité</td><td>Emprunter l’identité d’un utilisateur ou d’un composant</td></tr><tr><td>T</td><td>Tampering (altération)</td><td>Intégrité</td><td>Modifier sans droit des données ou du code</td></tr><tr><td>R</td><td>Repudiation (répudiation)</td><td>Non-répudiation</td><td>Absence de preuves pour établir qui a fait quoi</td></tr><tr><td>I</td><td>Information disclosure</td><td>Confidentialité</td><td>Exposition d’informations à des tiers non autorisés</td></tr><tr><td>D</td><td>Denial of service</td><td>Disponibilité</td><td>Rendre un service indisponible</td></tr><tr><td>E</td><td>Elevation of privilege</td><td>Autorisation</td><td>Obtenir plus de droits que prévu</td></tr></table>"}},"iso":{"titre":"Flash ISO 27005","qs":[{"q":"Dans ISO 27005, quelle étape vient juste après l’appréciation du risque chez TransLor ?","o":["l’acceptation du risque","le traitement du risque","le suivi et la revue","établir le contexte"],"ok":1,"ind":"","exp":"Après l’appréciation (identifier, analyser, évaluer), on traite le risque. L’acceptation du risque résiduel vient ensuite.","det":"Bonne réponse : le traitement du risque.\nOn décide : réduire, éviter, transférer ou accepter.\nPourquoi les autres réponses sont écartées :\n• établir le contexte : c’est la première étape\n• acceptation : elle porte sur le risque résiduel, après le traitement\n• suivi et revue : transversal, après la mise en œuvre"},{"q":"TransLor souscrit une cyber-assurance contre le rançongiciel. Quelle option de traitement ?","o":["transférer","éviter","réduire","accepter"],"ok":0,"ind":"","exp":"Transférer (ou partager) : une partie de la perte financière passe à l’assureur. Le risque n’est pas supprimé.","det":"Bonne réponse : transférer.\nLe coût financier est porté en partie par l’assureur.\nPourquoi les autres réponses sont écartées :\n• réduire : il faudrait des mesures techniques\n• éviter : il faudrait supprimer l’activité\n• accepter : on ne ferait rien"},{"q":"Que signifie la boucle PDCA appliquée à ISO 27005 pour TransLor ?","o":["on remplace l’analyse par un audit annuel","on analyse une fois pour toutes puis on archive","on ne traite que les risques élevés puis on ferme le dossier","on refait l’analyse à chaque changement significatif"],"ok":3,"ind":"","exp":"La gestion des risques est un cycle : on recommence quand le système, les menaces ou les critères changent.","det":"Bonne réponse : on refait l’analyse à chaque changement.\nPDCA = Plan, Do, Check, Act : une amélioration continue.\nPourquoi les autres réponses sont écartées :\n• audit annuel : un audit contrôle, il ne remplace pas l’analyse\n• risques élevés puis clôture : les risques moyens et résiduels restent suivis\n• analyse unique : les menaces et le système évoluent"}],"rap":{"t":"Rappel : ISO/IEC 27005, structure et principes","pg":"page 109","h":"<ol><li>Établir le contexte</li><li>Appréciation du risque : identifier (actifs, menaces, vulnérabilités, scénarios), analyser (impact et vraisemblance), évaluer (comparer aux critères d’acceptation)</li><li>Traitement du risque : réduire, éviter, transférer, accepter ; plan de traitement, risque résiduel</li><li>Acceptation</li><li>Suivi et revue</li></ol><p>Transversal : communication et consultation, documentation et traçabilité, boucle PDCA.</p>"}},"dread":{"titre":"Flash DREAD","qs":[{"q":"Comment se calcule le score DREAD d’une menace chez TransLor ?","o":["impact multiplié par fréquence","moyenne des cinq notes de 1 à 3","somme pondérée par le CVSS","la note la plus élevée des cinq critères"],"ok":1,"ind":"","exp":"Score DREAD = moyenne des cinq notes (Damage, Reproducibility, Exploitability, Affected users, Discoverability).","det":"Bonne réponse : moyenne des cinq notes.\nCinq critères notés de 1 à 3 puis moyennés.\nPourquoi les autres réponses sont écartées :\n• note la plus élevée : ce serait un maximum, pas un score DREAD\n• impact × fréquence : c’est la matrice de risque du chapitre 1\n• somme pondérée CVSS : le CVSS est une autre méthode"},{"q":"La faille d’Exchange de TransLor est publique et facile à trouver. Quel critère DREAD reçoit la note 3 ?","o":["Reproducibility","Damage","Discoverability","Affected users"],"ok":2,"ind":"","exp":"Discoverability : 1 = cachée, 3 = publique.","det":"Bonne réponse : Discoverability.\nUne faille publique se découvre sans effort.\nPourquoi les autres réponses sont écartées :\n• Damage : mesure les dégâts\n• Reproducibility : mesure la facilité à refaire l’attaque\n• Affected users : le nombre d’utilisateurs touchés"},{"q":"Quelle est la principale limite de DREAD ?","o":["les notes sont subjectives : deux équipes n’obtiennent pas le même résultat","il ne s’applique qu’aux applications web","il ne tient pas compte du nombre d’utilisateurs touchés","il impose de chiffrer le risque en euros"],"ok":0,"ind":"","exp":"Les notes dépendent du jugement de chacun. Pour une vulnérabilité connue on préfère CVSS.","det":"Bonne réponse : notes subjectives.\nSans grille précise, chacun note à sa façon.\nPourquoi les autres réponses sont écartées :\n• applications web seulement : il s’applique à toute menace\n• risque en euros : DREAD ne chiffre pas en euros\n• utilisateurs touchés : le critère Affected users existe"}],"rap":{"t":"Rappel : DREAD","pg":"page 135","h":"<table><tr><th>Critère</th><th>Question</th><th>Note de 1 à 3</th></tr><tr><td>D · Damage</td><td>Quels dégâts si l’attaque réussit ?</td><td>1 faibles · 3 majeurs</td></tr><tr><td>R · Reproducibility</td><td>L’attaque est-elle facile à reproduire ?</td><td>1 difficile · 3 toujours</td></tr><tr><td>E · Exploitability</td><td>Quel niveau de compétence faut-il ?</td><td>1 expert · 3 débutant</td></tr><tr><td>A · Affected users</td><td>Combien d’utilisateurs sont touchés ?</td><td>1 peu · 3 tous</td></tr><tr><td>D · Discoverability</td><td>La faille est-elle facile à trouver ?</td><td>1 cachée · 3 publique</td></tr></table><p>Score DREAD = moyenne des cinq notes.</p>"}},"risque":{"titre":"Flash chiffré : classer le risque (autres nombres)","qs":[{"q":"Au site de Metz de TransLor (cas inventé), un arrêt coûte 40 000 € par jour. Une panne de 6 jours arrive 1 fois tous les 4 ans. Quel est l’impact d’une panne ?","o":["240 000 €","160 000 €","280 000 €","120 000 €"],"ok":0,"ind":"","exp":"6 × 40 000 = 240 000 €. C’est l’impact d’un seul événement, sans tenir compte de la fréquence.","det":"Bonne réponse : 240 000 €.\n6 jours × 40 000 € = 240 000 € pour un seul événement.\nPourquoi les autres réponses sont écartées :\n• 120 000 € : correspond à 3 jours\n• 160 000 € : correspond à 4 jours\n• 280 000 € : correspond à 7 jours"},{"q":"Quelle est la fréquence de cette panne exprimée par an ?","o":["2,5 par an","0,25 par an","0,4 par an","4 par an"],"ok":1,"ind":"","exp":"1 fois tous les 4 ans = 1 / 4 = 0,25 par an.","det":"Bonne réponse : 0,25 par an.\n1 / 4 = 0,25.\nPourquoi les autres réponses sont écartées :\n• 4 par an : inverse : 4 ans, pas 4 fois\n• 0,4 par an : confusion avec 4 / 10\n• 2,5 par an : confusion avec 10 / 4"},{"q":"Quel est le coût annuel attendu de cette panne ?","o":["240 000 € par an","10 000 € par an","96 000 € par an","60 000 € par an"],"ok":3,"ind":"","exp":"Impact × fréquence par an = 240 000 × 0,25 = 60 000 € par an.","det":"Bonne réponse : 60 000 € par an.\n240 000 × 0,25 = 60 000.\nPourquoi les autres réponses sont écartées :\n• 240 000 € par an : c’est l’impact, pas le coût annuel\n• 96 000 € par an : 240 000 × 0,4 : mauvaise fréquence\n• 10 000 € par an : mauvais produit : 40 000 / 4"},{"q":"Une fraude coûte 30 000 € et arrive 2 fois par an : même coût annuel attendu que la panne (60 000 €). La direction décide de traiter d’abord le risque dont un seul événement menace la continuité. Lequel ?","o":["aucun : les deux sont à égalité","la fraude, car son impact par événement est plus faible","la panne (240 000 € en un seul événement)","la fraude, car elle arrive plus souvent"],"ok":2,"ind":"","exp":"À coût attendu égal, le critère de la direction est l’impact d’un seul événement : la panne.","det":"Bonne réponse : la panne.\nImpact de 240 000 € pour un seul événement, contre 30 000 € pour la fraude.\nPourquoi les autres réponses sont écartées :\n• la fraude plus fréquente : c’est un autre critère (la fréquence)\n• égalité : les coûts annuels sont égaux mais le critère donné les départage\n• fraude impact plus faible : un impact plus faible est moins prioritaire"}],"rap":{"t":"Rappel : évaluer un risque (méthode)","pg":"page 36","h":"<table><tr><th>Niveau</th><th>Impact (€)</th><th>Fréquence</th></tr><tr><td>1 Faible</td><td>&lt; 10 k€</td><td>&lt; 1 fois en 10 ans</td></tr><tr><td>2 Moyen</td><td>10 à 50 k€</td><td>1 fois tous les 5 ans</td></tr><tr><td>3 Élevé</td><td>50 à 250 k€</td><td>1 fois par an</td></tr><tr><td>4 Critique</td><td>&gt; 250 k€</td><td>&gt; 1 fois par an</td></tr></table><p>Risque R = Impact I × Fréquence F (I et F de 1 à 4). Impact d’un événement = durée d’arrêt × coût d’un jour. Lecture : accepter · surveiller · traiter · traiter en priorité (mot + symbole : ✓ ▲ ⚠ ■).</p>"}},"divul":{"titre":"Flash chiffré : délai de divulgation (autres dates)","qs":[{"q":"Un chercheur signale au fournisseur du TMS de TransLor une faille le 10 avril. Sa politique : publier à 90 jours. Quelle est la date de publication ?","o":["11 juillet","8 juillet","10 juillet","9 juillet"],"ok":3,"ind":"","exp":"Avril restant : 20 jours (10 → 30 avril), mai : 31, juin : 30 → 81 jours au 30 juin ; il reste 9 jours : le 9 juillet.","det":"Bonne réponse : 9 juillet.\n20 + 31 + 30 = 81 jours au 30 juin, plus 9 jours.\nPourquoi les autres réponses sont écartées :\n• 8 juillet : oubli d’un jour\n• 10 juillet : on a compté le jour du signalement\n• 11 juillet : deux jours de trop"},{"q":"Le correctif du fournisseur est disponible au jour 60. Quelle est sa date ?","o":["9 juin","8 juin","10 juin","9 juillet"],"ok":0,"ind":"","exp":"Avril : 20 jours, mai : 31 → 51 jours au 31 mai ; il reste 9 jours : le 9 juin.","det":"Bonne réponse : 9 juin.\n20 + 31 = 51 jours au 31 mai, plus 9 jours.\nPourquoi les autres réponses sont écartées :\n• 8 juin : un jour de moins\n• 10 juin : un jour de plus\n• 9 juillet : c’est la date du jour 90"},{"q":"TransLor applique ses correctifs le 1er août. Combien de jours reste-t-elle exposée publiquement après la publication du 9 juillet ?","o":["53 jours","9 jours","23 jours","31 jours"],"ok":2,"ind":"","exp":"Du 9 juillet au 1er août : 22 jours restants de juillet (9 → 31) + 1 jour = 23 jours.","det":"Bonne réponse : 23 jours.\n22 + 1 = 23.\nPourquoi les autres réponses sont écartées :\n• 9 jours : confusion avec le chiffre 9\n• 31 jours : juillet entier\n• 53 jours : confusion avec le délai du correctif"},{"q":"Un correctif est prêt avant la publication, après un délai fixé avec le chercheur. Quelle pratique de divulgation est appliquée ?","o":["la vente de la faille à un courtier","la divulgation coordonnée (responsable)","la divulgation privée sans publication","le full disclosure"],"ok":1,"ind":"","exp":"Divulgation coordonnée : le fournisseur corrige avant la publication.","det":"Bonne réponse : divulgation coordonnée.\nUn délai est fixé pour permettre le correctif avant la publication.\nPourquoi les autres réponses sont écartées :\n• full disclosure : publication immédiate\n• privée sans publication : la faille n’est jamais rendue publique\n• vente à un courtier : pratique non éthique"}],"rap":{"t":"Rappel : calculer une date de publication","pg":"méthode","h":"<ul><li>Date de publication = date de signalement + délai de la politique de divulgation.</li><li>Compter les jours restants du mois de départ, puis ajouter les mois entiers, jusqu’à atteindre le délai.</li><li>Jours par mois : janvier 31 · février 28 (29 en année bissextile) · mars 31 · avril 30 · mai 31 · juin 30 · juillet 31 · août 31 · septembre 30 · octobre 31 · novembre 30 · décembre 31.</li></ul>"}},"hist":{"titre":"QCM historique et divulgation","qs":[{"q":"Culture pour le comité de TransLor : quel ver informatique est considéré comme le premier à grande échelle ?","o":["Morris Worm (1988)","Conficker (2008)","Code Red (2001)","Stuxnet (2010)"],"ok":0,"ind":"","exp":"Morris Worm (1988). Les autres sont postérieurs.","det":"Bonne réponse : Morris Worm.\nLancé en 1988, il a infecté une part notable de l’Internet de l’époque.\nPourquoi les autres réponses sont écartées :\n• Code Red : 2001\n• Conficker : 2008\n• Stuxnet : 2010, ver industriel ciblé"},{"q":"Quelle bibliothèque était affectée par Heartbleed ?","o":["Bash","Apache HTTP Server","OpenSSL","Log4j"],"ok":2,"ind":"","exp":"OpenSSL (2014).","det":"Bonne réponse : OpenSSL.\nHeartbleed était une fuite mémoire dans l’implémentation du protocole heartbeat.\nPourquoi les autres réponses sont écartées :\n• Log4j : Log4Shell, 2021\n• Apache HTTP Server : non concerné\n• Bash : Shellshock, 2014"},{"q":"Le TMS de TransLor consigne ses événements avec Log4j. Quelle vulnérabilité permettait une exécution de code via les journaux ?","o":["Heartbleed","Log4Shell","EternalBlue","Shellshock"],"ok":1,"ind":"","exp":"Log4Shell (CVE-2021-44228).","det":"Bonne réponse : Log4Shell.\nUne chaîne piégée écrite dans les journaux déclenchait une exécution de code.\nPourquoi les autres réponses sont écartées :\n• Shellshock : touchait Bash\n• Heartbleed : fuite mémoire, pas d’exécution de code\n• EternalBlue : exploitait SMB"},{"q":"Quel est le principal risque du full disclosure ?","o":["un retard de correction par le fournisseur","un coût pour le chercheur","la perte de confiance des utilisateurs","une exploitation immédiate par des attaquants"],"ok":3,"ind":"","exp":"Le full disclosure publie avant le correctif : l’attaquant a une fenêtre d’exploitation.","det":"Bonne réponse : exploitation immédiate.\nAucun correctif n’existe quand la faille devient publique.\nPourquoi les autres réponses sont écartées :\n• retard de correction : risque d’une divulgation tenue secrète\n• perte de confiance : conséquence indirecte\n• coût pour le chercheur : pas le risque principal"},{"q":"Que signifie CVE ?","o":["Common Vulnerabilities and Exposures","Cyber Vulnerability Exposure","Critical Vulnerability Evaluation","Common Vulnerabilities and Exploits"],"ok":0,"ind":"","exp":"Programme créé en 1999 par le MITRE ; « Exposures » et non « Exploits » : c’est un identifiant, pas du code d’attaque.","det":"Bonne réponse : Common Vulnerabilities and Exposures.\nUn identifiant public de faille.\nPourquoi les autres réponses sont écartées :\n• … and Exploits : un identifiant n’est pas du code d’attaque\n• Cyber Vulnerability Exposure : nom inventé\n• Critical Vulnerability Evaluation : nom inventé"}]},"menaces":{"titre":"QCM menaces et cas d’école","qs":[{"q":"Un groupe disposant de moyens importants, ciblé et discret, utilise souvent des zero-days. Quel type de menace ?","o":["un botnet","un rançongiciel opportuniste","un groupe hacktiviste","une APT"],"ok":3,"ind":"","exp":"APT : les attaquants ciblés et financés ont les moyens d’acquérir ou de découvrir des zero-days.","det":"Bonne réponse : APT.\nAdvanced Persistent Threat : ciblée, durable, financée.\nPourquoi les autres réponses sont écartées :\n• rançongiciel opportuniste : vise l’argent vite, avec des failles connues\n• botnet : réseau de machines infectées\n• hacktiviste : motivé par une cause, pas forcément équipé"},{"q":"Si un poste de TransLor avait été touché par WannaCry (2017), quel protocole l’aurait propagé entre machines ?","o":["HTTP","FTP","SMB","RDP"],"ok":2,"ind":"","exp":"SMB : EternalBlue exploitait SMBv1.","det":"Bonne réponse : SMB.\nLe ver se propageait par le partage de fichiers SMBv1.\nPourquoi les autres réponses sont écartées :\n• RDP : exploité par BlueKeep, pas WannaCry\n• HTTP : pas le vecteur\n• FTP : pas le vecteur"},{"q":"Quel botnet a ciblé les objets connectés (caméras, routeurs) ?","o":["Mirai","Stuxnet","Zeus","Emotet"],"ok":0,"ind":"","exp":"Mirai (2016). Zeus est un cheval de Troie bancaire ; Stuxnet un ver industriel.","det":"Bonne réponse : Mirai.\nIl utilisait des identifiants par défaut sur des objets connectés.\nPourquoi les autres réponses sont écartées :\n• Zeus : cheval de Troie bancaire\n• Emotet : diffusé par courriel\n• Stuxnet : ver industriel"},{"q":"Dans SolarWinds, quel vecteur a été compromis ?","o":["un mot de passe faible","une mise à jour logicielle (chaîne d’approvisionnement)","un courriel de phishing","une clé USB piégée"],"ok":1,"ind":"","exp":"Mise à jour logicielle : chaîne d’approvisionnement, la mise à jour d’Orion.","det":"Bonne réponse : mise à jour logicielle.\nOrion a distribué une mise à jour signée mais piégée.\nPourquoi les autres réponses sont écartées :\n• phishing : pas le vecteur\n• mot de passe faible : non décisif\n• clé USB : non"},{"q":"Qui est chargé du contrôle de la conformité au RGPD chez TransLor ?","o":["le DPO (délégué à la protection des données)","le RSSI","le DSI","l’analyste du SOC"],"ok":0,"ind":"","exp":"Le DPO a pour mission de contrôler le respect du RGPD (art. 39) et de conseiller l’organisme.","det":"Bonne réponse : le DPO.\nArt. 39 du RGPD : contrôle du respect du règlement.\nPourquoi les autres réponses sont écartées :\n• RSSI : pilote la sécurité\n• analyste SOC : détecte les incidents\n• DSI : dirige le système d’information"}]},"p1kc":{"titre":"Relier événements et étapes de la Kill Chain (exercice 1)","qs":[{"ty":"m","q":"Associez chaque événement de l’attaque chez TransLor à son étape de la Cyber Kill Chain (Lockheed Martin). Deux termes sont des leurres.","L":["A · Une clé de registre relance le programme à chaque ouverture de session","B · Un attaquant relève sur LinkedIn les noms des administrateurs de TransLor","C · Le poste contacte un serveur extérieur toutes les 5 minutes","D · Le document est envoyé par courriel à la comptabilité","E · Les données de paie sont compressées puis envoyées vers un stockage cloud","F · Il enregistre un domaine proche de celui d’un fournisseur et prépare un document piégé","G · Une macro s’exécute sur un poste"],"R":["Reconnaissance","Armement","Livraison","Exploitation","Installation","Commande et contrôle","Actions sur objectifs","Mouvement latéral","Contournement des défenses"],"ok":[4,0,5,2,6,1,3],"ind":"Les sept étapes se suivent dans l’ordre : de l’observation de la cible jusqu’à l’objectif final.","exp":"A Installation (la clé de registre garantit la survie au redémarrage) · B Reconnaissance (on observe la cible) · C Commande et contrôle (contact régulier avec l’attaquant) · D Livraison (le courriel part) · E Actions sur objectifs (collecte puis envoi des données). « Mouvement latéral » et « Contournement des défenses » sont des tactiques ATT&CK, pas des étapes de la Kill Chain de Lockheed Martin. · F Armement (on prépare le domaine et le document piégé) · G Exploitation (la macro s’exécute)","det":"Corrigé détaillé, ligne par ligne :\n• A · Une clé de registre relance le programme à chaque ouverture de session → Installation\n• B · Un attaquant relève sur LinkedIn les noms des administrateurs de TransLor → Reconnaissance\n• C · Le poste contacte un serveur extérieur toutes les 5 minutes → Commande et contrôle\n• D · Le document est envoyé par courriel à la comptabilité → Livraison\n• E · Les données de paie sont compressées puis envoyées vers un stockage cloud → Actions sur objectifs\n• F · Il enregistre un domaine proche de celui d’un fournisseur et prépare un document piégé → Armement\n• G · Une macro s’exécute sur un poste → Exploitation\n\nExplication : A Installation (la clé de registre garantit la survie au redémarrage) · B Reconnaissance (on observe la cible) · C Commande et contrôle (contact régulier avec l’attaquant) · D Livraison (le courriel part) · E Actions sur objectifs (collecte puis envoi des données). « Mouvement latéral » et « Contournement des défenses » sont des tactiques ATT&CK, pas des étapes de la Kill Chain de Lockheed Martin. · F Armement (on prépare le domaine et le document piégé) · G Exploitation (la macro s’exécute)"}],"rap":{"t":"Rappel : les sept événements d’une même attaque","pg":"page 11","h":"<h3>Cas TransLor : sept événements, dans le désordre</h3><ul><li>A · Une clé de registre relance le programme à chaque ouverture de session</li><li>B · Un attaquant relève sur LinkedIn les noms des administrateurs de TransLor</li><li>C · Le poste contacte un serveur extérieur toutes les 5 minutes</li><li>D · Le document est envoyé par courriel à la comptabilité</li><li>E · Les données de paie sont compressées puis envoyées vers un stockage cloud</li><li>F · Il enregistre un domaine proche de celui d’un fournisseur et prépare un document piégé</li><li>G · Une macro s’exécute sur un poste</li></ul><h3>Les sept étapes de la Cyber Kill Chain (Lockheed Martin, 2011)</h3><p>Reconnaissance → Armement → Livraison → Exploitation → Installation → Commande et contrôle → Actions sur objectifs</p>"}},"vmra":{"titre":"Relier situations et termes (menace, vulnérabilité, risque, attaque)","qs":[{"ty":"m","q":"Reliez chaque situation à son terme.","L":["a · Le même mot de passe administrateur est utilisé sur tous les serveurs de TransLor","b · Un groupe criminel veut chiffrer les serveurs de TransLor pour réclamer une rançon","c · Un arrêt du TMS pendant trois jours : impact 4 × vraisemblance 3 = niveau 12","d · Un salarié ouvre un document piégé : la macro s’exécute et chiffre le serveur de fichiers","e · Une version d’Exchange non corrigée est joignable depuis Internet"],"R":["Menace","Vulnérabilité","Risque","Attaque"],"ok":[1,0,2,3,1],"exp":"La menace veut, la vulnérabilité permet, l’attaque fait, le risque mesure. Le mot de passe partagé (a) et Exchange non corrigé (e) sont des faiblesses ; le groupe criminel (b) est une source de danger ; le niveau 12 (c) est une mesure ; la macro qui chiffre (d) est l’acte.","ind":"Quatre mots, cinq situations : un mot sert deux fois.","det":"Corrigé détaillé, ligne par ligne :\n• a · Le même mot de passe administrateur est utilisé sur tous les serveurs de TransLor → Vulnérabilité\n• b · Un groupe criminel veut chiffrer les serveurs de TransLor pour réclamer une rançon → Menace\n• c · Un arrêt du TMS pendant trois jours : impact 4 × vraisemblance 3 = niveau 12 → Risque\n• d · Un salarié ouvre un document piégé : la macro s’exécute et chiffre le serveur de fichiers → Attaque\n• e · Une version d’Exchange non corrigée est joignable depuis Internet → Vulnérabilité\n\nExplication : La menace veut, la vulnérabilité permet, l’attaque fait, le risque mesure. Le mot de passe partagé (a) et Exchange non corrigé (e) sont des faiblesses ; le groupe criminel (b) est une source de danger ; le niveau 12 (c) est une mesure ; la macro qui chiffre (d) est l’acte."}],"rap":{"t":"Rappel : menace, vulnérabilité, risque, attaque","pg":"page 23","h":"<table><tr><th>Terme</th><th>Définition</th></tr><tr><td>Menace</td><td>Potentiel danger qui pourrait exploiter une faille</td></tr><tr><td>Vulnérabilité</td><td>Faiblesse ou faille dans le système, susceptible d’être exploitée</td></tr><tr><td>Risque</td><td>Probabilité qu’une menace exploite une vulnérabilité et cause un impact</td></tr><tr><td>Attaque</td><td>Action concrète menée par une menace exploitant une vulnérabilité</td></tr></table><p>La menace est une possibilité, la vulnérabilité une faiblesse, l’attaque un acte, le risque une estimation.</p>"}},"txtvuln":{"titre":"Texte à compléter : vulnérabilité, menace, attaque, risque","qs":[{"ty":"m","q":"Complétez chaque trou de l’histoire du serveur de fichiers de TransLor avec un des quatre mots (un mot par trou).","L":["Le serveur de fichiers de TransLor n’est plus corrigé depuis deux ans : c’est une …","Un groupe criminel a repéré ce serveur et pourrait s’en servir : il représente une …","Il exploite la faille, entre et chiffre les fichiers : c’est l’… réalisée.","Avant tout cela, la direction avait estimé « vraisemblance × impact » : c’est un …"],"R":["menace","vulnérabilité","attaque","risque"],"ok":[1,0,2,3],"exp":"Le serveur non corrigé est une vulnérabilité, le groupe qui pourrait s’en servir une menace, l’exploitation de la faille une attaque (l’acte réalisé), et « vraisemblance × impact » est un risque : une estimation.","ind":"La menace veut, la vulnérabilité permet, l’attaque fait, le risque mesure.","det":"Corrigé détaillé, ligne par ligne :\n• Le serveur de fichiers de TransLor n’est plus corrigé depuis deux ans : c’est une … → vulnérabilité\n• Un groupe criminel a repéré ce serveur et pourrait s’en servir : il représente une … → menace\n• Il exploite la faille, entre et chiffre les fichiers : c’est l’… réalisée. → attaque\n• Avant tout cela, la direction avait estimé « vraisemblance × impact » : c’est un … → risque\n\nExplication : Le serveur non corrigé est une vulnérabilité, le groupe qui pourrait s’en servir une menace, l’exploitation de la faille une attaque (l’acte réalisé), et « vraisemblance × impact » est un risque : une estimation."}],"rap":{"t":"Rappel : menace, vulnérabilité, risque, attaque","pg":"page 23","h":"<table><tr><th>Terme</th><th>Définition</th></tr><tr><td>Menace</td><td>Potentiel danger qui pourrait exploiter une faille</td></tr><tr><td>Vulnérabilité</td><td>Faiblesse ou faille dans le système, susceptible d’être exploitée</td></tr><tr><td>Risque</td><td>Probabilité qu’une menace exploite une vulnérabilité et cause un impact</td></tr><tr><td>Attaque</td><td>Action concrète menée par une menace exploitant une vulnérabilité</td></tr></table><p>La menace est une possibilité, la vulnérabilité une faiblesse, l’attaque un acte, le risque une estimation.</p>"}},"pasta":{"titre":"Flash : à quelle étape de PASTA ?","qs":[{"ty":"m","q":"Indiquez l’étape PASTA qui correspond à chaque activité.","L":["a · On établit le catalogue des menaces de TransLor (rançongiciel, fraude au RIB) à partir de scénarios réalistes","b · On dessine les arbres d’attaque de la fraude au RIB de TransLor","c · On produit le registre des risques de TransLor et son plan de traitement","d · On aligne la sécurité sur les objectifs métier de TransLor (livrer sans interruption)"],"R":["Étape 1 · objectifs métiers","Étape 2 · périmètre technique","Étape 3 · décomposition de l’application","Étape 4 · analyse des menaces","Étape 5 · analyse des vulnérabilités","Étape 6 · modélisation des attaques","Étape 7 · risques et impacts"],"ok":[3,5,6,0],"exp":"PASTA va du métier (1) à la technique (2 à 6) puis revient au métier (7) : les objectifs au début, les risques et le plan de traitement à la fin.","ind":"Le métier ouvre et ferme la méthode.","det":"Corrigé détaillé, ligne par ligne :\n• a · On établit le catalogue des menaces de TransLor (rançongiciel, fraude au RIB) à partir de scénarios réalistes → Étape 4 · analyse des menaces\n• b · On dessine les arbres d’attaque de la fraude au RIB de TransLor → Étape 6 · modélisation des attaques\n• c · On produit le registre des risques de TransLor et son plan de traitement → Étape 7 · risques et impacts\n• d · On aligne la sécurité sur les objectifs métier de TransLor (livrer sans interruption) → Étape 1 · objectifs métiers\n\nExplication : PASTA va du métier (1) à la technique (2 à 6) puis revient au métier (7) : les objectifs au début, les risques et le plan de traitement à la fin."}],"rap":{"t":"Rappel : les sept étapes de PASTA","pg":"page 145","h":"<ol><li>Objectifs métiers</li><li>Périmètre technique</li><li>Décomposition</li><li>Analyse des menaces</li><li>Analyse des vulnérabilités</li><li>Modélisation des attaques</li><li>Risques et impacts</li></ol>"}},"navzone":{"titre":"Flash : dans quelle zone de Navigator ?","qs":[{"ty":"m","q":"Indiquez la zone de Navigator utilisée pour chaque action du TP de TransLor.","L":["a · Enregistrer en JSON le layer de couverture de TransLor","b · Colorer une technique et lui donner un score de détection","c · Chercher APT29 et sélectionner toutes ses techniques","d · Choisir la version d’ATT&CK et filtrer sur la plateforme Windows du parc de TransLor","e · Ajouter un commentaire de détection sur une technique"],"R":["Layer Controls","Technique Controls","Selection Controls"],"ok":[0,1,2,0,1],"exp":"Un layer est un fichier JSON : Layer Controls gère le fichier et ses propriétés (version, filtres), Technique Controls annote une case (couleur, score, commentaire), Selection Controls choisit des cases (recherche de groupes, de logiciels).","ind":"Le fichier, la case ou la sélection ?","det":"Corrigé détaillé, ligne par ligne :\n• a · Enregistrer en JSON le layer de couverture de TransLor → Layer Controls\n• b · Colorer une technique et lui donner un score de détection → Technique Controls\n• c · Chercher APT29 et sélectionner toutes ses techniques → Selection Controls\n• d · Choisir la version d’ATT&CK et filtrer sur la plateforme Windows du parc de TransLor → Layer Controls\n• e · Ajouter un commentaire de détection sur une technique → Technique Controls\n\nExplication : Un layer est un fichier JSON : Layer Controls gère le fichier et ses propriétés (version, filtres), Technique Controls annote une case (couleur, score, commentaire), Selection Controls choisit des cases (recherche de groupes, de logiciels)."}],"rap":{"t":"Rappel : les trois zones de Navigator","pg":"page 193","h":"<ul><li>Layer Controls</li><li>Technique Controls</li><li>Selection Controls</li></ul>"}},"tacttech":{"titre":"Tactique, technique ou sous-technique ?","qs":[{"ty":"m","q":"Le rapport d’incident de TransLor mêle tactiques, techniques et sous-techniques. Classez chaque élément.","L":["Execution (TA0002)","T1059 Command and Scripting Interpreter","T1059.001 PowerShell","Credential Access (TA0006)","T1003 OS Credential Dumping"],"R":["Tactique","Technique","Sous-technique"],"ok":[0,1,2,0,1],"exp":"La tactique répond à « pourquoi ? » (identifiant TA), la technique à « comment ? » (T suivi de quatre chiffres), la sous-technique précise la technique (suffixe .001). Erreur fréquente : classer PowerShell comme tactique : c’est une sous-technique de la tactique Execution.","ind":"Le préfixe TA ou T, et le suffixe après le point.","det":"Corrigé détaillé, ligne par ligne :\n• Execution (TA0002) → Tactique\n• T1059 Command and Scripting Interpreter → Technique\n• T1059.001 PowerShell → Sous-technique\n• Credential Access (TA0006) → Tactique\n• T1003 OS Credential Dumping → Technique\n\nExplication : La tactique répond à « pourquoi ? » (identifiant TA), la technique à « comment ? » (T suivi de quatre chiffres), la sous-technique précise la technique (suffixe .001). Erreur fréquente : classer PowerShell comme tactique : c’est une sous-technique de la tactique Execution."}]},"chaine":{"titre":"Où couper la chaîne ? (Kill Chain)","qs":[{"ty":"m","q":"Placez chaque mesure sur l’étape de la chaîne où elle agit d’abord. Deux étapes sont des leurres.","L":["A · Macros Office bloquées sur les documents venant d’Internet","B · Passerelle antispam avec analyse des pièces jointes en bac à sable","C · Filtrage des connexions sortantes par liste de destinations","D · Formation des comptables au repérage des fausses factures","E · EDR sur les postes avec alertes au SOC","F · Sauvegardes hors ligne testées"],"R":["Reconnaissance","Armement","Livraison","Exploitation","Installation","Commande et contrôle","Actions sur objectifs"],"ok":[3,2,5,2,4,6],"exp":"Antispam et formation agissent à la livraison, avant tout clic. Les macros bloquées coupent l’exploitation. L’EDR détecte à l’installation. Le filtrage sortant coupe le contact avec l’attaquant. Les sauvegardes limitent l’impact en fin de chaîne. Reconnaissance et Armement sont des leurres : ces mesures n’agissent pas avant que le message n’arrive.","ind":"Avant que le message n’arrive, après le clic, ou après le chiffrement ?","det":"Corrigé détaillé, ligne par ligne :\n• A · Macros Office bloquées sur les documents venant d’Internet → Exploitation\n• B · Passerelle antispam avec analyse des pièces jointes en bac à sable → Livraison\n• C · Filtrage des connexions sortantes par liste de destinations → Commande et contrôle\n• D · Formation des comptables au repérage des fausses factures → Livraison\n• E · EDR sur les postes avec alertes au SOC → Installation\n• F · Sauvegardes hors ligne testées → Actions sur objectifs\n\nExplication : Antispam et formation agissent à la livraison, avant tout clic. Les macros bloquées coupent l’exploitation. L’EDR détecte à l’installation. Le filtrage sortant coupe le contact avec l’attaquant. Les sauvegardes limitent l’impact en fin de chaîne. Reconnaissance et Armement sont des leurres : ces mesures n’agissent pas avant que le message n’arrive."}],"rap":{"t":"Rappel : les sept étapes de la Cyber Kill Chain","pg":"page 126","h":"<ol><li>Reconnaissance</li><li>Armement</li><li>Livraison</li><li>Exploitation</li><li>Installation</li><li>Commande et contrôle</li><li>Actions sur objectifs</li></ol><p>Plus on agit tôt dans la chaîne, moins l’attaque coûte à la victime. Une seule étape coupée suffit à arrêter l’attaque. Source : Hutchins et al., Lockheed Martin, 2011 (à vérifier).</p>"}},"tact12":{"titre":"Flash : quelle tactique ? (douze actions)","qs":[{"ty":"m","q":"Pour chacune des douze actions observées chez TransLor, donnez la tactique ATT&CK (parmi les 15).","L":["1 · Balises HTTPS toutes les 60 secondes vers un serveur externe (T1071.001)","2 · Connexion RDP vers un serveur de fichiers avec un compte volé (T1021.001)","3 · Exécution de PowerShell encodé en base 64 (T1059.001)","4 · Désactivation de l’antivirus avant le déploiement (T1685)","5 · Pièce jointe Word piégée envoyée par mail (T1566.001)","6 · Suppression des sauvegardes puis chiffrement des serveurs (T1490, T1486)","7 · Commande nslookup -type=mx pour trouver les serveurs de messagerie (T1590.002)","8 · Création d’un serveur cloud pour recevoir les données volées (T1583.006)","9 · Clé de registre Run qui relance le programme au démarrage (T1547.001)","10 · Vidage de la mémoire de LSASS avec procdump (T1003.001)","11 · Envoi de l’archive vers un stockage cloud (T1567.002)","12 · Compression des fichiers dans une archive 7-Zip (T1560.001)"],"R":["Reconnaissance","Resource Development","Initial Access","Execution","Persistence","Privilege Escalation","Stealth","Defense Impairment","Credential Access","Discovery","Lateral Movement","Collection","Command and Control","Exfiltration","Impact"],"ok":[12,10,3,7,2,14,0,1,4,8,13,11],"exp":"Se demander à chaque action : que cherche l’attaquant à ce moment ? Pièges classiques : les balises HTTPS (1) sont du pilotage, donc Command and Control, et non de l’exfiltration ; la compression (12) rassemble avant de sortir, donc Collection. Pour l’action 12, la tactique Defense Impairment est nouvelle en v19 (auparavant Defense Evasion) : liste des 15 tactiques à vérifier sur attack.mitre.org.","ind":"Il prépare, il entre, il reste, il vole, il pilote, il sort, il détruit.","det":"Corrigé détaillé, ligne par ligne :\n• 1 · Balises HTTPS toutes les 60 secondes vers un serveur externe (T1071.001) → Command and Control\n• 2 · Connexion RDP vers un serveur de fichiers avec un compte volé (T1021.001) → Lateral Movement\n• 3 · Exécution de PowerShell encodé en base 64 (T1059.001) → Execution\n• 4 · Désactivation de l’antivirus avant le déploiement (T1685) → Defense Impairment\n• 5 · Pièce jointe Word piégée envoyée par mail (T1566.001) → Initial Access\n• 6 · Suppression des sauvegardes puis chiffrement des serveurs (T1490, T1486) → Impact\n• 7 · Commande nslookup -type=mx pour trouver les serveurs de messagerie (T1590.002) → Reconnaissance\n• 8 · Création d’un serveur cloud pour recevoir les données volées (T1583.006) → Resource Development\n• 9 · Clé de registre Run qui relance le programme au démarrage (T1547.001) → Persistence\n• 10 · Vidage de la mémoire de LSASS avec procdump (T1003.001) → Credential Access\n• 11 · Envoi de l’archive vers un stockage cloud (T1567.002) → Exfiltration\n• 12 · Compression des fichiers dans une archive 7-Zip (T1560.001) → Collection\n\nExplication : Se demander à chaque action : que cherche l’attaquant à ce moment ? Pièges classiques : les balises HTTPS (1) sont du pilotage, donc Command and Control, et non de l’exfiltration ; la compression (12) rassemble avant de sortir, donc Collection. Pour l’action 12, la tactique Defense Impairment est nouvelle en v19 (auparavant Defense Evasion) : liste des 15 tactiques à vérifier sur attack.mitre.org."}],"rap":{"t":"Rappel : les douze actions et les 15 tactiques","pg":"pages 248 à 249 et 209","h":"<h3>Les douze actions observées chez TransLor</h3><ul><li>1 · Balises HTTPS toutes les 60 secondes vers un serveur externe (T1071.001)</li><li>2 · Connexion RDP vers un serveur de fichiers avec un compte volé (T1021.001)</li><li>3 · Exécution de PowerShell encodé en base 64 (T1059.001)</li><li>4 · Désactivation de l’antivirus avant le déploiement (T1685)</li><li>5 · Pièce jointe Word piégée envoyée par mail (T1566.001)</li><li>6 · Suppression des sauvegardes puis chiffrement des serveurs (T1490, T1486)</li><li>7 · Commande nslookup -type=mx pour trouver les serveurs de messagerie (T1590.002)</li><li>8 · Création d’un serveur cloud pour recevoir les données volées (T1583.006)</li><li>9 · Clé de registre Run qui relance le programme au démarrage (T1547.001)</li><li>10 · Vidage de la mémoire de LSASS avec procdump (T1003.001)</li><li>11 · Envoi de l’archive vers un stockage cloud (T1567.002)</li><li>12 · Compression des fichiers dans une archive 7-Zip (T1560.001)</li></ul><h3>Les 15 tactiques de la matrice Enterprise</h3><p>Reconnaissance · Resource Development · Initial Access · Execution · Persistence · Privilege Escalation · Stealth · Defense Impairment · Credential Access · Discovery · Lateral Movement · Collection · Command and Control · Exfiltration · Impact</p>"}},"accueil":{"titre":"Accueil : test de connexion","qs":[{"q":"Votre niveau actuel avec MITRE ATT&CK ?","o":["Jamais utilisé","J’en ai entendu parler","Utilisé en TP ou en projet","Utilisé en entreprise"],"ok":-1,"ind":"Sondage : il n’y a pas de bonne réponse.","exp":"Sondage sans bonne réponse : l’animateur adapte le rythme du cours à ces résultats."}]},"ex24":{"titre":"Exercice 24 · Nuit de dimanche chez TransLor : quelle tactique ?","rap":{"t":"Scénario : une nuit de dimanche chez TransLor","pg":"page 304","h":"<h3>Le scénario</h3><ul><li>Dimanche 22:00 : connexion au VPN avec le compte d’un ancien salarié (compte actif, pas de MFA)</li><li>22:20 : exploration de l’annuaire et du réseau</li><li>22:40 : vidage de la mémoire LSASS sur un serveur</li><li>23:00 : script PowerShell de déploiement lancé sur les serveurs</li><li>23:30 : connexion RDP à trois serveurs, partages SMB</li><li>02:00 : suppression des copies de sauvegarde</li><li>04:00 : chiffrement des serveurs</li><li>Lundi 07:42 : l’exploitation découvre l’arrêt</li></ul><h3>Défenses de TransLor</h3><ul><li>Pare-feu avec VPN (journaux locaux)</li><li>Antivirus classique sur les postes et serveurs</li><li>1 NAS de sauvegarde, accessible par les comptes d’administration</li><li>Journaux Windows non centralisés</li><li>Pas de MFA, pas de SIEM, pas d’EDR</li></ul><p><small>Cas fictif : chiffres et événements inventés pour l’exercice.</small></p>"},"qs":[{"ty":"m","q":"Associez chacun de ces cinq événements de la nuit chez TransLor à sa tactique ATT&CK. Deux termes sont des leurres ; une même tactique peut servir deux fois.","L":["A · 02:00 : suppression des copies de sauvegarde","B · Dimanche 22:00 : connexion au VPN avec le compte d’un ancien salarié (compte actif, pas de MFA)","C · 04:00 : chiffrement des serveurs","D · 23:30 : connexion RDP à trois serveurs, partages SMB","E · 22:40 : vidage de la mémoire LSASS sur un serveur"],"R":["Initial Access","Credential Access","Lateral Movement","Impact","Discovery","Exfiltration","Execution"],"ok":[3,0,3,2,1],"ind":"Demandez-vous à chaque ligne : que cherche l’attaquant à ce moment ?","exp":"Connexion avec un compte valide : Initial Access. Vidage de LSASS : Credential Access. RDP et partages : Lateral Movement. Suppression des sauvegardes puis chiffrement : Impact (deux événements). Discovery et Exfiltration sont des leurres : rien dans le scénario n’explore ni n’emporte de données.","det":"Corrigé détaillé, ligne par ligne :\n• A · 02:00 : suppression des copies de sauvegarde → Impact\n• B · Dimanche 22:00 : connexion au VPN avec le compte d’un ancien salarié (compte actif, pas de MFA) → Initial Access\n• C · 04:00 : chiffrement des serveurs → Impact\n• D · 23:30 : connexion RDP à trois serveurs, partages SMB → Lateral Movement\n• E · 22:40 : vidage de la mémoire LSASS sur un serveur → Credential Access\n\nExplication : Connexion avec un compte valide : Initial Access. Vidage de LSASS : Credential Access. RDP et partages : Lateral Movement. Suppression des sauvegardes puis chiffrement : Impact (deux événements). Discovery et Exfiltration sont des leurres : rien dans le scénario n’explore ni n’emporte de données."}]},"ressources":{"titre":"Ressources : bibliographie ATT&CK","qs":[{"ty":"r","q":"Consultez l’article puis la vidéo cités dans la bibliographie (ouvrez-les sur votre PC).","R":[{"t":"Article : Comment utiliser le MITRE ATT&CK pour analyser une menace informatique (Cyberwatch)","u":"https://cyberwatch.fr/veille/comment-utiliser-le-mitre-attack-pour-analyser-une-menace-informatique/","k":"article"},{"t":"Vidéo YouTube : MITRE ATT&CK","u":"https://www.youtube.com/watch?v=1Zdq-BWPWRk","k":"vidéo"}],"ok":-1,"exp":"ATT&CK sert à décrire une attaque observée (tactiques, techniques) et à comparer avec ce que l’on détecte déjà. Contenu des ressources non relu par l’auteur de cette fiche : à vérifier avant la séance.","det":"Ressources non relues au moment de la rédaction : l’article Cyberwatch (adresse fournie par l’enseignant) et la vidéo YouTube 1Zdq-BWPWRk. À visionner avant la séance pour compléter cette correction avec les points propres aux ressources."},{"q":"Un « layer » dans ATT&CK Navigator est…","o":["un fichier de configuration du pare-feu de TransLor","une sous-technique d’ATT&CK","une vue personnalisée du framework : des techniques choisies, annotées et colorées pour un objectif précis","un groupe d’attaquants suivi par MITRE"],"ok":2,"ind":"","exp":"Un layer est une vue personnalisée du framework (cartographie d’une attaque, couverture défensive, simulation).","det":"Bonne réponse : une vue personnalisée du framework.\nUn layer est enregistré en JSON et peut être partagé.\nPourquoi les autres réponses sont écartées :\n• configuration du pare-feu : sans rapport avec Navigator\n• sous-technique : c’est un élément de la matrice, pas une vue\n• groupe d’attaquants : les groupes ont un identifiant G…"},{"q":"Pour analyser l’attaque subie par TransLor, comment utilise-t-on un layer ?","o":["on colore les techniques observées dans l’attaque, puis on les compare à celles que l’on détecte déjà","on y affiche le score CVSS de chaque poste","on y recopie la liste des CVE de l’Exchange","on y saisit les mots de passe volés pour les suivre"],"ok":0,"ind":"","exp":"On cartographie l’attaque (techniques observées) puis on compare avec la couverture de détection.","det":"Bonne réponse : colorer les techniques observées puis comparer.\nC’est le geste central de l’analyse : voir ce que l’attaquant a fait et ce que l’on aurait vu.\nPourquoi les autres réponses sont écartées :\n• liste des CVE : ATT&CK ne liste pas de CVE\n• mots de passe volés : aucune donnée sensible n’a sa place dans un layer\n• score CVSS : le CVSS note des vulnérabilités, pas des techniques"}]},"def1":{"titre":"Défi TransLor 1 · L’ancien collègue","qs":[{"q":"Chez TransLor : Paul a quitté l’entreprise vendredi dans de mauvais termes. Dimanche, son compte, jamais désactivé, se connecte à la messagerie et au VPN. Quelle tactique ATT&CK ?","o":["Resource Development","Persistence","Execution","Initial Access"],"ok":3,"ind":"« compte jamais désactivé qui se connecte dimanche » : un compte valide.","exp":"Compte valide non désactivé : Initial Access (T1078).","det":"Bonne réponse : Initial Access.\nBut de l’attaquant : Utiliser un vrai compte pour se faire passer pour un utilisateur légitime, sans rien exploiter.\nTechnique observée : T1078.\nComment le voir : Connexions à des heures ou depuis des pays inhabituels, compte de personne partie, voyage impossible (deux lieux éloignés en peu de temps).\nComment l’empêcher : Désactiver les comptes au départ, authentification multifacteur, revue régulière des comptes, alertes de connexion atypique.\nPourquoi les autres réponses sont écartées :\n• Persistence : il ne s’agit pas d’un retour durable mais d’une entrée.\n• Resource Development : ne correspond pas à l’objectif décrit\n• Execution : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : Le compte consulte la liste des comptes à privilèges, ce qu’il n’avait jamais fait. Quelle tactique ATT&CK ?","o":["Credential Access","Discovery","Defense Impairment","Lateral Movement"],"ok":1,"ind":"« liste des comptes à privilèges » : repérage.","exp":"Discovery (T1087.002).","det":"Bonne réponse : Discovery.\nBut de l’attaquant : Savoir qui existe dans l’annuaire, qui est administrateur, pour choisir ses cibles.\nTechnique observée : T1087.002.\nComment le voir : Séries de requêtes d’annuaire par un compte qui n’en fait jamais, outils d’énumération connus.\nComment l’empêcher : Droits de lecture limités, alertes sur les requêtes massives, journalisation des contrôleurs de domaine.\nPourquoi les autres réponses sont écartées :\n• Credential Access : on ne vole pas de mot de passe.\n• Lateral Movement : ne correspond pas à l’objectif décrit\n• Defense Impairment : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : Il ajoute son compte à un groupe d’administration et crée un compte de secours. Quelle tactique ATT&CK ?","o":["Execution","Privilege Escalation","Persistence","Initial Access"],"ok":2,"ind":"« ajoute son compte à un groupe d’administration, crée un compte de secours ».","exp":"Manipulation de compte : Persistence (T1098).","det":"Bonne réponse : Persistence.\nBut de l’attaquant : Modifier un compte (groupes, mots de passe, clés) pour garder ou augmenter ses droits.\nTechnique observée : T1098.\nComment le voir : Alertes sur les changements de groupes d’administration, création de comptes, modifications hors processus.\nComment l’empêcher : Journaliser et alerter sur les groupes sensibles, demandes de droits tracées, revue périodique.\nPourquoi les autres réponses sont écartées :\n• Privilege Escalation : on modifie un compte pour durer.\n• Execution : ne correspond pas à l’objectif décrit\n• Initial Access : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : Il télécharge en masse des pages d’un espace de documentation interne, dont des procédures et des contrats. Quelle tactique ATT&CK ?","o":["Collection","Lateral Movement","Exfiltration","Command and Control"],"ok":0,"ind":"« télécharge en masse des pages de documentation » : on rassemble des documents.","exp":"Collection (T1213) : données de dépôts d’information.","det":"Bonne réponse : Collection.\nBut de l’attaquant : Aspirer les documents d’un espace de partage ou de documentation interne.\nTechnique observée : T1213.\nComment le voir : Téléchargements massifs par un compte qui consulte peu, accès hors horaires.\nComment l’empêcher : Droits par fonction, alertes sur les téléchargements en masse, journalisation des accès.\nPourquoi les autres réponses sont écartées :\n• Exfiltration : rien ne sort encore.\n• Lateral Movement : ne correspond pas à l’objectif décrit\n• Command and Control : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : Les documents sont compressés dans une archive protégée par mot de passe. Quelle tactique ATT&CK ?","o":["Command and Control","Lateral Movement","Exfiltration","Collection"],"ok":3,"ind":"« documents compressés dans une archive protégée » : préparation avant sortie.","exp":"Préparer les données : Collection (T1560.001).","det":"Bonne réponse : Collection.\nBut de l’attaquant : Compresser et protéger les données pour les sortir plus vite et sans être vu.\nTechnique observée : T1560.001.\nComment le voir : Création d’archives de grande taille dans un répertoire temporaire, outils de compression lancés par des services.\nComment l’empêcher : Surveillance des outils de compression, prévention de la perte de données, limitation des droits de lecture.\nPourquoi les autres réponses sont écartées :\n• Exfiltration : l’archive est encore sur place.\n• Lateral Movement : ne correspond pas à l’objectif décrit\n• Command and Control : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : L’archive est envoyée vers un stockage cloud personnel, à 22 h. Quelle tactique ATT&CK ?","o":["Exfiltration","Collection","Impact","Command and Control"],"ok":0,"ind":"« envoyée vers un stockage cloud personnel à 22 h » : les données sortent.","exp":"Exfiltration (T1567.002).","det":"Bonne réponse : Exfiltration.\nBut de l’attaquant : Sortir les données vers un stockage cloud public que le réseau laisse passer.\nTechnique observée : T1567.002.\nComment le voir : Gros volumes vers des services de partage de fichiers, en dehors des heures de travail.\nComment l’empêcher : Filtrage des services cloud non autorisés, prévention de la perte de données, alertes sur les volumes sortants.\nPourquoi les autres réponses sont écartées :\n• Collection : la copie est déjà faite.\n• Command and Control : ne correspond pas à l’objectif décrit\n• Impact : ne correspond pas à l’objectif décrit"},{"q":"Chez TransLor : Avant de partir, il efface plusieurs dossiers de projets sur le partage commun. Quelle tactique ATT&CK ?","o":["Command and Control","Impact","Collection","Exfiltration"],"ok":1,"ind":"« efface plusieurs dossiers » : les données sont détruites.","exp":"Destruction de données : Impact (T1485).","det":"Bonne réponse : Impact.\nBut de l’attaquant : Détruire des données pour nuire.\nTechnique observée : T1485.\nComment le voir : Suppressions massives de fichiers
