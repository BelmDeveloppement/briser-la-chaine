button.s{background:#2a4a85;color:var(--t)}button.sm{padding:6px 10px;font-size:14px}button:disabled{opacity:.4;cursor:default}

<script>
const SETS={"atk": {"titre": "QCM ATT&CK", "qs": [{"q": "Que représente une « tactique » dans MITRE ATT&CK ?", "o": ["Un outil utilisé par l’attaquant", "Un objectif stratégique de l’attaquant", "Une vulnérabilité", "Un groupe d’attaquants"], "ok": 1, "ind": "Pensez à la question « pourquoi ? » : la tactique est le but, la technique est le moyen.", "exp": "La tactique est le « pourquoi » (ex. Credential Access). L’outil relève d’une procédure ; la vulnérabilité relève d’une CVE."}, {"q": "Quelle technique correspond au vol d’identifiants dans la mémoire du processus LSASS ?", "o": ["T1059", "T1003.001", "T1547", "T1566"], "ok": 1, "ind": "Le vol d’identifiants est dans la tactique Credential Access. T1003 est « OS Credential Dumping ».", "exp": "T1003.001 = OS Credential Dumping : LSASS Memory. T1059 est l’interpréteur de commandes, T1547 la persistance au démarrage, T1566 l’hameçonnage."}, {"q": "Quel usage est typique d’ATT&CK dans un SOC ?", "o": ["Créer des virus", "Cartographier ses alertes et mesurer sa couverture de détection", "Mesurer les performances du réseau", "Chiffrer les sauvegardes"], "ok": 1, "ind": "Un SOC détecte : à quoi sert une carte des techniques que l’on sait (ou non) détecter ?", "exp": "On rattache chaque règle ou alerte à une technique pour voir les trous de couverture (layer Navigator)."}, {"q": "Quelle est la différence entre une technique et une sous-technique ?", "o": ["La sous-technique est une variante plus précise d’une technique", "La technique est plus rare", "La sous-technique est un outil", "Il n’y a aucune différence"], "ok": 0, "ind": "Regardez les identifiants : T1003 et T1003.001. Que signifie le « .001 » ?", "exp": "Exemple : T1003 (technique générale) et T1003.001 LSASS Memory (sous-technique, une façon précise de la réaliser)."}, {"q": "Quel outil permet de visualiser la matrice ATT&CK et d’annoter des techniques ?", "o": ["Nmap", "ATT&CK Navigator", "Wireshark", "Nessus"], "ok": 1, "ind": "Un seul de ces quatre outils colore des techniques sur la matrice. Les autres scannent ou capturent.", "exp": "Navigator permet de créer des layers (couleurs, scores, commentaires). Nmap scanne des ports, Wireshark capture le trafic, Nessus cherche des vulnérabilités."}]}, "final": {"titre": "QCM final du module", "qs": [{"q": "Dans ATT&CK, « Credential Access » est :", "o": ["une technique", "une tactique", "un groupe d’attaquants", "un outil"], "ok": 1, "ind": "Il y a 15 éléments de ce type dans la matrice Enterprise, avec un identifiant en TA.", "exp": "Credential Access est la tactique TA0006 ; T1003 en est une technique."}, {"q": "Dans STRIDE, la lettre R (Repudiation) correspond à la violation de :", "o": ["la confidentialité", "l’intégrité", "la non-répudiation", "la disponibilité"], "ok": 2, "ind": "Chaque lettre de STRIDE viole une propriété de sécurité. Que signifie « répudier » une action ?", "exp": "Repudiation ↔ non-répudiation : on peut nier avoir fait une action faute de preuve."}, {"q": "Dans un arbre d’attaque, un nœud OU a pour coût :", "o": ["le minimum de ses enfants", "la somme de ses enfants", "le maximum de ses enfants", "la moyenne de ses enfants"], "ok": 0, "ind": "Pour un nœud OU, l’attaquant n’a besoin que d’une branche. Laquelle choisit-il ?", "exp": "L’attaquant prend la voie la moins chère : minimum. Pour un nœud ET, on additionne."}, {"q": "Quel indicateur dit qu’une vulnérabilité est déjà exploitée dans la nature ?", "o": ["CVSS", "KEV", "CWE", "CPE"], "ok": 1, "ind": "CVSS note la gravité technique, CWE classe les faiblesses, CPE identifie un produit. Un seul signale l’exploitation.", "exp": "Le catalogue KEV (Known Exploited Vulnerabilities) de la CISA recense les CVE exploitées."}, {"q": "ISO/IEC 27005 est :", "o": ["un catalogue de mesures de sécurité", "la norme des exigences du SMSI", "des lignes directrices de gestion des risques", "un référentiel de vulnérabilités"], "ok": 2, "ind": "Dans la famille 27000 : 27001 = exigences, 27002 = mesures. Et 27005 ?", "exp": "27001 = exigences du SMSI, 27002 = catalogue de mesures, 27005 = gestion des risques."}]}, "j1": {"titre": "Rappel du jour 1", "qs": [{"q": "Quelles sont, dans l’ordre, les cinq étapes d’une modélisation des menaces ?", "o": ["Menaces, actifs, risques, cartographie, mesures", "Actifs, cartographie du système, menaces, risques, mesures", "Cartographie, mesures, actifs, menaces, risques", "Risques, menaces, actifs, mesures, cartographie"], "ok": 1, "ind": "On commence par ce qu’on protège, on finit par ce qu’on fait.", "exp": "Actifs, cartographie, menaces, risques, mesures : on ne peut pas chercher des menaces avant de savoir ce que l’on protège et comment le système est construit."}, {"q": "Que signifie le « S » de STRIDE et quelle propriété de sécurité est visée ?", "o": ["Sabotage : la disponibilité", "Spoofing (usurpation d’identité) : l’authenticité", "Surveillance : la confidentialité", "Spoofing : l’intégrité"], "ok": 1, "ind": "Quelqu’un se fait passer pour un autre.", "exp": "Spoofing = usurpation d’identité ; la propriété visée est l’authenticité."}, {"q": "Combien d’étapes compte la méthode PASTA ?", "o": ["Trois", "Cinq", "Sept", "Douze"], "ok": 2, "ind": "PASTA est la méthode « orientée processus » en étapes numérotées de 1 à ….", "exp": "PASTA compte sept étapes, des objectifs métier jusqu’à l’analyse du risque et des contre-mesures."}, {"q": "Pour quel besoin choisit-on TRIKE ?", "o": ["Chiffrer le coût de chaque chemin d’attaque", "Raconter une attaque en sept phases", "Vérifier qui peut faire quoi sur quels actifs (droits et rôles)", "Noter une menace avec cinq critères"], "ok": 2, "ind": "TRIKE part d’une matrice entre acteurs, actifs et actions.", "exp": "TRIKE est centrée sur les droits : matrice acteurs, actifs, actions."}, {"q": "Quelle paire de méthodes se combine bien avec ATT&CK ?", "o": ["PASTA et arbres d’attaque (scénarios et chemins), STRIDE pour catégoriser", "DREAD seul", "TRIKE seul", "Aucune : ATT&CK remplace toutes les autres"], "ok": 0, "ind": "ATT&CK décrit les comportements : il complète les méthodes qui construisent des scénarios.", "exp": "PASTA (scénarios) et les arbres d’attaque (chemins chiffrés) se rattachent aux techniques ATT&CK ; STRIDE catégorise les menaces."}]}, "surface": {"titre": "QCM surface d’attaque", "qs": [{"q": "La surface d’attaque est :", "o": ["Une faille précise dans un logiciel", "Un ensemble de points d’entrée exploitables", "Une mauvaise configuration du pare-feu", "Le nombre d’utilisateurs d’un service"], "ok": 1, "ind": "Une surface, ce n’est pas un seul point.", "exp": "La surface est l’ensemble des points d’entrée. Une faille est une vulnérabilité, une mauvaise configuration est un élément de la surface, pas la surface."}, {"q": "Le phishing exploite quelle surface d’attaque ?", "o": ["Réseau", "Physique", "Humaine", "Applicative"], "ok": 2, "ind": "Qui est visé : une machine ou une personne ?", "exp": "Le phishing vise l’utilisateur, pas le réseau : surface humaine."}, {"q": "Quelle action réduit la surface d’attaque ?", "o": ["Ajouter des services pour les clients", "Segmenter le réseau", "Reporter les mises à jour", "Ouvrir davantage de ports"], "ok": 1, "ind": "Quelle action coupe les chemins d’attaque ?", "exp": "Segmenter coupe les chemins d’attaque ; ajouter des services ou ignorer les mises à jour agrandit la surface."}, {"q": "La faille d’Apache Struts (Equifax, 2017) relève de quelle surface ?", "o": ["Physique", "Logicielle", "Humaine", "Organisationnelle"], "ok": 1, "ind": "Un composant tiers non corrigé.", "exp": "Un composant logiciel tiers non corrigé : surface logicielle."}, {"q": "Quel outil permet de scanner vous-même les ports d’un réseau ?", "o": ["OWASP ZAP", "Nmap", "Shodan", "Wireshark"], "ok": 1, "ind": "Un seul des trois outils envoie lui-même les paquets de découverte de ports.", "exp": "Nmap scanne les ports. ZAP teste des applications web ; Shodan interroge un index existant sans que vous scanniez vous-même ; Wireshark capture du trafic."}]}, "ident": {"titre": "Flash : type d’identifiant ATT&CK", "qs": [{"q": "TA0001 désigne :", "o": ["Une technique", "Une tactique", "Un groupe", "Une mitigation"], "ok": 1, "ind": "TA = …", "exp": "Le préfixe TA désigne une tactique (TA0001 = Initial Access)."}, {"q": "T1059 désigne :", "o": ["Une tactique", "Une technique", "Une sous-technique", "Un logiciel"], "ok": 1, "ind": "T suivi de quatre chiffres.", "exp": "T1059 = Command and Scripting Interpreter : une technique."}, {"q": "T1059.001 désigne :", "o": ["Une technique", "Une sous-technique", "Un groupe", "Une tactique"], "ok": 1, "ind": "Le suffixe après le point.", "exp": "Le « .001 » précise la technique : PowerShell. C’est une sous-technique."}, {"q": "G0016 désigne :", "o": ["Un groupe d’attaquants", "Une mesure défensive", "Une technique", "Un logiciel malveillant"], "ok": 0, "ind": "G comme …", "exp": "G = groupe (G0016 = APT29)."}, {"q": "M1032 désigne :", "o": ["Un groupe", "Une technique", "Une mitigation (mesure défensive)", "Une tactique"], "ok": 2, "ind": "M comme …", "exp": "M = mitigation (M1032 = Multi-factor Authentication)."}]}, "dict": {"titre": "Flash : CVE, CWE, CAPEC ou ATT&CK ?", "qs": [{"q": "Une faille précise dans une version d’Apache Log4j :", "o": ["CVE", "CWE", "CAPEC", "ATT&CK"], "ok": 0, "ind": "Une faille précise, numérotée par année.", "exp": "CVE-2021-44228 : une vulnérabilité précise dans un produit."}, {"q": "Le type de faiblesse « injection d’expression » :", "o": ["CVE", "CWE", "CAPEC", "ATT&CK"], "ok": 1, "ind": "On décrit une famille de faiblesses de conception ou de code.", "exp": "CWE-917 : le type de faiblesse."}, {"q": "Le schéma d’attaque qui exploite ce type de faiblesse :", "o": ["CVE", "CWE", "CAPEC", "ATT&CK"], "ok": 2, "ind": "On décrit la manière d’exploiter.", "exp": "CAPEC-242 : la manière d’exploiter la faiblesse."}, {"q": "La technique T1190 de la tactique Initial Access :", "o": ["CVE", "CWE", "CAPEC", "ATT&CK"], "ok": 3, "ind": "Une tactique, une technique : quel référentiel ?", "exp": "ATT&CK décrit le comportement observé de l’attaquant, rattaché à une tactique."}]}, "accueil": {"titre": "Accueil : test de connexion", "qs": [{"q": "Votre niveau actuel avec MITRE ATT&CK ?", "o": ["Jamais utilisé", "J’en ai entendu parler", "Utilisé en TP ou en projet", "Utilisé en entreprise"], "ok": -1, "ind": "Sondage : il n’y a pas de bonne réponse.", "exp": "Sondage sans bonne réponse : l’animateur adapte le rythme du cours à ces résultats."}]}, "stride": {"titre": "Flash STRIDE", "qs": [{"q": "Un employé modifie en base l’IBAN d’un fournisseur pour détourner un virement. Quelle catégorie STRIDE ?", "o": ["Spoofing", "Tampering", "Repudiation", "Elevation of privilege"], "ok": 1, "ind": "Quelle propriété est violée : l’intégrité, la confidentialité ou la disponibilité ?", "exp": "Tampering (altération) : la donnée est modifiée sans droit, donc l’intégrité est violée. Mesures : contrôle d’accès, validation des entrées, contrôle d’intégrité."}, {"q": "Un administrateur partagé efface les journaux : personne ne peut prouver qui a agi. Quelle catégorie ?", "o": ["Information disclosure", "Repudiation", "Denial of service", "Spoofing"], "ok": 1, "ind": "Il manque une preuve de qui a fait quoi.", "exp": "Repudiation (répudiation) : on ne peut plus établir qui a fait quoi. Mesure : journalisation centralisée et inaltérable, horodatage fiable, signatures sur les actions critiques."}, {"q": "Quelle mesure répond le mieux à une saturation volontaire du portail de suivi des colis ?", "o": ["Authentification multifacteur", "Chiffrement TLS", "Limitation de débit et protection anti-DDoS", "Journalisation signée"], "ok": 2, "ind": "La saturation attaque la disponibilité.", "exp": "Denial of service : on protège la disponibilité avec des quotas, du rate limiting et de l’anti-DDoS. Le MFA répond au spoofing, TLS à l’information disclosure, la journalisation signée à la repudiation."}]}, "iso": {"titre": "Flash ISO 27005", "qs": [{"q": "Dans ISO 27005, quelle étape vient juste après l’appréciation du risque ?", "o": ["Établir le contexte", "Traitement du risque", "Acceptation du risque", "Suivi et revue"], "ok": 1, "ind": "Apprécier, puis décider quoi faire des risques.", "exp": "Après l’appréciation (identifier, analyser, évaluer), on traite le risque : réduire, éviter, transférer ou accepter. L’acceptation du risque résiduel vient ensuite."}, {"q": "TransLor souscrit une cyber-assurance contre le rançongiciel. Quelle option de traitement ?", "o": ["Réduire", "Éviter", "Transférer", "Accepter"], "ok": 2, "ind": "Qui supporte la perte financière une fois l’assurance souscrite ?", "exp": "Transférer (ou partager) : une partie de la perte financière passe à l’assureur. Le risque n’est pas supprimé et un risque résiduel subsiste."}, {"q": "Que signifie la boucle PDCA appliquée à ISO 27005 ?", "o": ["On refait l’analyse à chaque changement significatif", "On analyse les risques une seule fois", "On ne traite que les risques élevés", "On remplace l’analyse par un audit"], "ok": 0, "ind": "PDCA signifie Plan, Do, Check, Act.", "exp": "La gestion des risques est un cycle : on recommence quand le système, les menaces ou les critères changent, et on suit les risques résiduels."}]}, "dread": {"titre": "Flash DREAD", "qs": [{"q": "Comment se calcule le score DREAD ?", "o": ["Moyenne des cinq notes de 1 à 3", "Note la plus élevée des cinq critères", "Impact multiplié par fréquence", "Somme pondérée par le CVSS"], "ok": 0, "ind": "Cinq critères notés de 1 à 3.", "exp": "Score DREAD = moyenne des cinq notes (Damage, Reproducibility, Exploitability, Affected users, Discoverability)."}, {"q": "Une faille publique, facile à trouver : quel critère reçoit la note 3 ?", "o": ["Damage", "Exploitability", "Affected users", "Discoverability"], "ok": 3, "ind": "Il s’agit de la facilité à trouver la faille.", "exp": "Discoverability : 1 = cachée, 3 = publique. Damage mesure les dégâts, Exploitability la compétence nécessaire, Affected users le nombre d’utilisateurs touchés."}, {"q": "Quelle est la principale limite de DREAD ?", "o": ["Les notes sont subjectives : deux équipes n’obtiennent pas le même résultat", "Il ne couvre pas la confidentialité", "Il exige un outil payant", "Il ne sert que dans le cloud"], "ok": 0, "ind": "Qui attribue les notes ?", "exp": "Les notes dépendent du jugement de chacun. Pour une vulnérabilité connue on préfère CVSS ; sinon la matrice impact × fréquence du chapitre 1."}]}, "p1rel": {"titre": "Relier événements et tactiques (exercice P1)", "qs": [{"ty": "m", "q": "Reliez chaque événement de l’attaque chez TransLor à sa tactique ATT&CK. Deux termes sont des leurres.", "L": ["A · Un attaquant relève sur LinkedIn les noms des administrateurs de TransLor", "B · Il enregistre un domaine proche de celui d’un fournisseur et prépare un document piégé", "C · Le document est envoyé par courriel à la comptabilité", "D · Une macro s’exécute sur un poste", "E · Une clé de registre relance le programme à chaque ouverture de session", "F · Le poste contacte un serveur extérieur toutes les 5 minutes", "G · Les données de paie sont compressées puis envoyées vers un stockage cloud"], "R": ["Persistence", "Exfiltration", "Reconnaissance", "Lateral Movement", "Command and Control", "Initial Access", "Privilege Escalation", "Execution", "Resource Development"], "ok": [2, 8, 5, 7, 0, 4, 1], "exp": "Se demander à chaque ligne : que cherche l’attaquant à ce moment ? Lateral Movement et Privilege Escalation sont des leurres : aucun événement ne décrit un déplacement ni une élévation de droits. En G, la compression relève aussi de Collection ; ici on retient l’envoi vers le cloud : Exfiltration.", "ind": "Une tactique = le but de l’attaquant à cet instant."}]}, "p1qcm": {"titre": "Quelle tactique ? (exercice P1)", "qs": [{"q": "Événement B : il enregistre un domaine proche de celui d’un fournisseur et prépare un document piégé. Quelle tactique ATT&CK ?", "o": ["Reconnaissance", "Resource Development", "Initial Access", "Defense Evasion"], "ok": 1, "exp": "Resource Development : l’attaquant construit ses moyens (domaine, document) avant d’agir sur la cible.", "ind": "Il prépare, il n’a pas encore touché la cible."}, {"q": "Événement F : le poste contacte un serveur extérieur toutes les 5 minutes. Quelle tactique ?", "o": ["Exfiltration", "Discovery", "Command and Control", "Persistence"], "ok": 2, "exp": "Command and Control : contact régulier avec l’attaquant pour recevoir des ordres. Ce n’est pas de l’exfiltration : aucune donnée n’est encore sortie.", "ind": "Un contact régulier = un canal de pilotage."}, {"q": "Événement G : les données de paie, déjà compressées, sont envoyées vers un stockage cloud. Quelle tactique pour l’envoi ?", "o": ["Collection", "Command and Control", "Exfiltration", "Impact"], "ok": 2, "exp": "Exfiltration : sortie des données. La compression, elle, relève de Collection : deux gestes, deux tactiques.", "ind": "Compresser rassemble ; envoyer fait sortir."}]}, "vmra": {"titre": "Relier situations et termes (menace, vulnérabilité, risque, attaque)", "qs": [{"ty": "m", "q": "Reliez chaque situation à son terme.", "L": ["a · Le même mot de passe administrateur est utilisé sur tous les serveurs de TransLor", "b · Un groupe criminel veut chiffrer les serveurs de TransLor pour réclamer une rançon", "c · Un arrêt du TMS pendant trois jours : impact 4 × vraisemblance 3 = niveau 12", "d · Un salarié ouvre un document piégé : la macro s’exécute et chiffre le serveur de fichiers", "e · Une version d’Exchange non corrigée est joignable depuis Internet"], "R": ["Menace", "Vulnérabilité", "Risque", "Attaque"], "ok": [1, 0, 2, 3, 1], "exp": "La menace veut, la vulnérabilité permet, l’attaque fait, le risque mesure. Le mot de passe partagé (a) et Exchange non corrigé (e) sont des faiblesses ; le groupe criminel (b) est une source de danger ; le niveau 12 (c) est une mesure ; la macro qui chiffre (d) est l’acte.", "ind": function Bus(room,onstat){
  const b={room,ws:null,up:false,subs:{},seen:new Set(),fails:0,sig:0,es:{},esOk:false,acks:{},ntfyAt:0,dead:false,onup:[]};
  const stat=()=>{try{onstat&&onstat()}catch(e){}};
  b.state=()=>MOCK||b.up?'ok':(b.esOk?'sec':'off');
  const deliver=(t,o,ts)=>{if(o&&o._u){if(b.seen.has(o._u))return;b.seen.add(o._u);if(b.seen.size>5000)b.seen.clear()}b.sig=Date.now();const s=b.subs[t];if(s)s.cb(o,ts)};
  function closeES(){Object.values(b.es).forEach(e=>{try{e.close()}catch(x){}});b.es={};b.esOk=false}
  function openES(){if(b.up||MOCK||b.dead)return;Object.keys(b.subs).forEach(t=>{if(b.es[t])return;
    const es=new EventSource(NTFY+'/'+t+'/sse?since='+(b.subs[t].nlast||'10m'));
    es.onopen=()=>{b.esOk=true;stat()};es.onerror=()=>{b.esOk=false;stat()};
    es.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}if(m.event&&m.event!=='message')return;if(m.id)b.subs[t].nlast=m.id;let o;try{o=JSON.parse(m.message)}catch(x){return}deliver(t,o,(m.time||0)*1000)};
    b.es[t]=es})}
  b.open=()=>{
    if(MOCK||b.dead||b.ws)return;
    let w;try{w=new WebSocket(WS+'?room='+encodeURIComponent(room))}catch(e){return setTimeout(b.open,3000)}
    b.ws=w;let ping=null,closed=false;
    w.onopen=()=>{b.up=true;b.fails=0;b.sig=Date.now();closeES();Object.keys(b.subs).forEach(t=>w.send(JSON.stringify({a:'sub',t,since:b.subs[t].last||0})));
      ping=setInterval(()=>{try{w.send('ping')}catch(e){}},25000);const q=b.onup.slice();q.forEach(f=>{try{f()}catch(e){}});stat()};
    w.onmessage=e=>{if(e.data==='pong'){b.sig=Date.now();return}let m;try{m=JSON.parse(e.data)}catch(x){return}
      if(m.a==='ack'){const k=b.acks[m.u];if(k){clearTimeout(k.t);delete b.acks[m.u];if(m.n===0)k.fb()}return}
      if(m.a!=='msg')return;const s=b.subs[m.t];if(!s)return;s.last=m.id;let o;try{o=JSON.parse(m.m)}catch(x){return}deliver(m.t,o,m.ts)};
    const end=()=>{if(closed)return;closed=true;clearInterval(ping);b.ws=null;b.up=false;b.fails++;stat();setTimeout(()=>{if(!b.up)openES()},4000);setTimeout(b.open,Math.min(15000,1000*Math.pow(2,Math.min(b.fails,4))))};
    w.onclose=end;w.onerror=end};
  if(MOCK){b.ch=new BroadcastChannel('qz-'+room);b.ch.onmessage=e=>{const m=e.data;let o;try{o=JSON.parse(m.m)}catch(x){return}deliver(m.t,o,Date.now())}}
  b.sub=(t,cb)=>{b.subs[t]={last:0,cb};if(b.up)b.ws.send(JSON.stringify({a:'sub',t,since:0}));else if(!MOCK){b.open();if(b.fails>0)openES()}};
  b.pub=(t,obj)=>{obj._u=rid();const body=JSON.stringify(obj);
    const post=()=>fetch(NTFY+'/'+t,{method:'POST',body}).catch(()=>{});
    const fb=()=>{const n=Date.now();if(n-b.ntfyAt<20000)return;b.ntfyAt=n;post()};  // ntfy ménagé : au plus 1 envoi / 20 s si le relais est joignable
    if(MOCK){b.ch.postMessage({t,m:body});return}
    if(b.up){const k={fb};k.t=setTimeout(()=>{delete b.acks[obj._u];fb()},2500);b.acks[obj._u]=k;try{b.ws.send(JSON.stringify({a:'pub',t,m:body,u:obj._u}));return}catch(e){clearTimeout(k.t);delete b.acks[obj._u]}}
    post()};
  b.resync=()=>{Object.keys(b.subs).forEach(t=>{b.subs[t].last=0;b.subs[t].nlast=null});
    if(MOCK)return;if(b.ws){try{b.ws.close()}catch(e){}}else b.open();closeES();setTimeout(()=>{if(!b.up)openES()},4000)};
  b.close=()=>{b.dead=true;try{b.ws&&b.ws.close()}catch(e){}closeES()};
  return b}

function curQ(){return G.set.qs[G.i]}

const isM=q=>q.ty==='m';

function view(){
  if(G.phase==='lobby')return lobby();if(G.phase==='end')return endView();if(isM(curQ()))return viewM();
  const q=curQ(),c=counts(),tot=plk().length,ans=answered(),mx=Math.max(1,...c),rev=G.phase==='rev';
  A.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${esc(G.set.titre)} · question ${G.i+1} / ${G.set.qs.length}</h2><div><span class="chip">${ans} / ${tot} réponses</span> <span class="chip">code ${G.code}</span></div></div>
  <div class="pb"><i style="width:${tot?100*ans/tot:0}%"></i></div><div class="q">${esc(q.q)}</div>
  ${q.o.map((o,k)=>`<div class="opt ${rev&&q.ok>=0?(k===q.ok?'good':'bad'):''}"><div class="bar" style="width:${100*c[k]/Math.max(mx,tot?ans:1)}%"></div><div class="lt">${L[k]}</div><div class="tx">${rev&&q.ok>=0?(k===q.ok?'✓ ':'✗ '):''}${esc(o)}</div><div class="n">${c[k]}</div></div>`).join('')}
  ${G.hint&&!rev?`<div class="hint"><b>Indice</b> : ${esc(q.ind)}</div>`:''}
  ${rev?`<div class="ban ${q.ok>=0&&ans&&c[q.ok]===ans?'g':'n'}">${q.ok>=0?c[q.ok]+' / '+ans+' ont bien répondu':'Résultat du sondage : '+ans+' réponses'}<small>${q.ok>=0?'Bonne réponse : '+L[q.ok]:'Pas de bonne réponse'}</small></div><div class="ex"><b>Explication</b><br>${esc(q.exp)}</div>`:''}
  <div class="row">${rev?`<button onclick="nextQ()">${G.i+1>=G.set.qs.length?'Voir la synthèse':'Question suivante'}</button>`:`<button class="s" onclick="showHint()" ${G.hint?'disabled':''}>Donner l’indice</button><button onclick="reveal()">Révéler la réponse</button>`} <span style="color:var(--m)">Barre d’espace : étape suivante</span></div>${manualBox()}`;slideBanner()}
function endView(){
  const r=rank(),n=G.set.qs.length;
  const rate=G.set.qs.map((q,i)=>{const t=plk().length,m=maxPts(q);return m===0?null:(t?Math.round(100*plk().reduce((n,k)=>n+pts(q,G.pl[k].ans[i]),0)/(t*m)):0)});
  const mk=(k,i)=>{const a=G.pl[k].ans[i];if(isM(G.set.qs[i])){const p=pts(G.set.qs[i],a),m=maxPts(G.set.qs[i]);return a==null?'<span class="mk n">–</span>':`<span class="mk ${p===m?'g':p?'n':'r'}">${p===m?'✓':p?'⚠':'✗'} ${p}/${m}</span>`}return a==null?'<span class="mk n" title="sans réponse">–</span>':(G.set.qs[i].ok<0?'<span class="mk n" title="sondage">•</span>':a===G.set.qs[i].ok?'<span class="mk g" title="juste">✓</span>':'<span class="mk r" title="faux">✗</span>')};
  A.innerHTML=`<h1>Synthèse · ${esc(G.set.titre)}</h1><div class="card"><table><tr><th>Participant</th>${G.set.qs.map((_,i)=>`<th>Q${i+1}</th>`).join('')}<th>Score</th></tr>
  ${r.map(x=>`<tr><td>${esc(x.nom)}${devTxt(G.pl[x.k])}</td>${G.set.qs.map((_,i)=>`<td>${mk(x.k,i)}</td>`).join('')}<td><b>${x.s} / ${nsc()}</b></td></tr>`).join('')}
  <tr><td><i>Réussite</i></td>${rate.map(v=>v===null?'<td>–</td>':`<td><b>${v>=70?'✓ ':v<40?'⚠ ':''}${v} %</b></td>`).join('')}<td></td></tr></table></div>
  <div class="row"><button class="s" onclick="G.i=-1;G.phase='lobby';pubState();lobby()">Retour au lobby</button><button class="s" onclick="replay()">Rejouer (mêmes participants)</button><button class="s" onclick="exportCSV()">Exporter .csv</button></div>`}
function exportCSV(){const n=G.set.qs.length,r=rank();const t='Participant;'+G.set.qs.map((_,i)=>'Q'+(i+1)).join(';')+';Score\n'+r.map(x=>[x.nom].concat(G.set.qs.map((q,i)=>{const a=G.pl[x.k].ans[i];return a==null?'-':isM(q)?pts(q,a)+'/'+maxPts(q):q.ok<0?'sondage':a===q.ok?'juste':'faux'})).concat([x.s+'/'+n]).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+t],{type:'text/csv'}));a.download='24_resultats_'+G.k+'.csv';a.click()}
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||'')))return;
  if(role==='host'&&G&&(e.key===' '||e.key==='ArrowRight')){e.preventDefault();if(G.phase==='lobby'&&plk().length)nextQ();else if(G.phase==='ask')reveal();else if(G.phase==='rev')nextQ()}
  if(role==='player'&&S&&S.st&&S.st.ph==='ask'&&S.st.ty!=='m'){const k=L.indexOf(e.key.toUpperCase());if(k>=0&&k<(S.st.o||[]).length)pick(k)}});
/* ================= Joueur ================= */
let C=null,S={};
function join(code){
  if(!code)return;role='player';drawBar();
  A.innerHTML=`<h1>MITRE <b>· jeu 24</b></h1><div class="card"><h2>Code ${esc(code)}</h2><p>Votre prénom (ou équipe). Si vous changez d’appareil, saisissez le <b>même prénom</b> : vous reprenez votre place.</p><input id="nom" maxlength="24" autocomplete="off" value="${esc(lsGet('qz_nom',''))}" onkeydown="if(event.key==='Enter')go('${esc(code)}')"><p><button onclick="go('${esc(code)}')">Entrer</button></p></div>`;
  const e=$('#nom');if(e)e.focus()}
function go(code){
  const nom=$('#nom').value.trim();if(!nom)return;lsSet('qz_nom',nom);
  S={nom,code,key:norm(nom),sk:'',st:null,ans:{},conf:{}};
  A.innerHTML='<p>Connexion…</p>';
  C=Bus('blc-'+code,()=>{drawBar();if(S.st)render()});
  C.sub('qz'+code+'h',onState);C.sub('qz'+code+'p',onPers);C.onup.push(sendHello);C.open();drawBar();
  setTimeout(()=>{if(!C.up&&!S.sent)sendHello()},3000);if(MOCK)sendHello()}
function sendHello(){S.sent=1;C.pub('qz'+S.code+'u',{t:'hello',nom:S.nom,dev:isTel()?'tel':'pc'})}
function ansKey(){return 'qz_ans_'+S.code+'_'+S.key+'_'+(S.sk||'')}
function onPers(m){if(m&&m.t==='mine'&&m.k===S.key&&(!m.s||m.s===S.sk)){Object.keys(m.ans||{}).forEach(i=>{S.conf[i]=true;if(S.ans[i]==null)S.ans[i]=m.ans[i]});lsSet(ansKey(),S.ans);if(S.st&&!(S.st.ph==='ask'&&S.st.ty==='m'))render()}}
function onState(s){if(!s||(S.st&&s.v<S.st.v))return;if((s.k||'')!==S.sk){S.sk=s.k||'';S.ans=lsGet(ansKey(),{});S.conf={}}const nq=!S.st||S.st.i!==s.i;const same=S.st&&S.st.ph===s.ph&&S.st.i===s.i&&S.st.k===s.k&&s.ph==='ask'&&!!S.st.ind===!!s.ind;S.st=s;if(nq)S.sent=1;if(!same)render()}
function st(h){A.innerHTML=`<div class="row" style="justify-content:space-between"><b>${esc(S.nom)}</b><span class="chip">code ${esc(S.code)}</span></div>`+h}
function render(){const s=S.st;if(!s)return st('<div class="card"><h2>Connexion en cours…</h2><p>En attente de l’animateur.</p></div>');
  if(s.ph==='lobby')return st('<div class="card"><h2>✓ Connecté</h2><p>Attendez la première question…</p></div>');
  if(s.ph==='ask')return qView();
  if(s.ph==='rev'&&s.ty==='m'){const a=S.ans[s.i]||[],n=s.L.length,p=ptsD(s.correct,a),sc=s.good.reduce((t,g,i)=>t+ptsD(g,S.ans[i]),0),nn=s.good.reduce((t,g)=>t+maxD(g),0);
    return st(`<div class="ban ${p===n?'g':p?'n':'r'}">${p===n?'✓ TOUT JUSTE':p?'⚠ PARTIEL':'✗ AUCUNE BONNE ASSOCIATION'}<small>${p} / ${n} bonnes associations</small></div><div class="card"><table><tr><th>Élément</th><th>Votre choix</th><th>Bonne réponse</th></tr>${s.L.map((l,j)=>`<tr><td>${esc(l)}</td><td>${a[j]===s.correct[j]?'✓':'✗'} ${a[j]==null?'–':esc(s.R[a[j]])}</td><td><b>${esc(s.R[s.correct[j]])}</b></td></tr>`).join('')}</table></div><div class="ex"><b>Explication</b><br>${esc(s.exp)}</div><p style="color:var(--m)">Score actuel : ${sc} / ${nn}</p>`)}
  if(s.ph==='rev'){const a=S.ans[s.i],ok=a===s.correct,sc=s.good.reduce((t,g,i)=>t+ptsD(g,S.ans[i]),0),nn=s.good.reduce((t,g)=>t+maxD(g),0);if(s.correct<0)return st(`<div class="ban n">${a==null?'– PAS DE RÉPONSE':'✓ RÉPONSE ENREGISTRÉE'}<small>Sondage : pas de bonne réponse</small></div><div class="ex"><b>Explication</b><br>${esc(s.exp)}</div>`);
    return st(`<div class="ban ${a==null?'n':ok?'g':'r'}">${a==null?'– PAS DE RÉPONSE':ok?'✓ BONNE RÉPONSE':'✗ MAUVAISE RÉPONSE'}<small>Bonne réponse : ${L[s.correct]}${s.o&&s.o[s.correct]?' · '+esc(s.o[s.correct]):''}</small></div><div class="ex"><b>Explication</b><br>${esc(s.exp)}</div><p style="color:var(--m)">Score actuel : ${sc} / ${nn}</p>`)}
  if(s.ph==='end'){const me=(s.res||[]).findIndex(x=>x.k===S.key),sc=s.good.reduce((t,g,i)=>t+ptsD(g,S.ans[i]),0),nn=s.good.reduce((t,g)=>t+maxD(g),0);
    return st(`<div class="ban n">Quiz terminé<small>Votre score : ${sc} / ${nn}${me>=0?' · rang '+(me+1)+' sur '+s.res.length:''}</small></div>`)}}
function qViewM(){const q=S.st,a=S.ans[q.i]||q.L.map(()=>null);
  st(`<div class="pb"><i style="width:${100*(q.i+1)/q.n}%"></i></div><div style="color:var(--m)">Question ${q.i+1} / ${q.n} · associez chaque élément à un terme</div><div class="q" style="font-size:24px">${esc(q.q)}</div>`+
  q.L.map((l,j)=>`<div class="card"><div style="margin-bottom:8px"><b>${j+1}.</b> ${esc(l)}</div><select aria-label="Terme pour l’élément ${j+1}" onchange="pickM(${j},this.value)"><option value="">— choisir un terme —</option>${q.R.map((r,k)=>`<option value="${k}" ${a[j]===k?'selected':''}>${esc(r)}</option>`).join('')}</select></div>`).join('')+
  (q.ind?`<div class="hint"><b>Indice</b> : ${esc(q.ind)}</div>`:'')+`<p style="color:var(--m)"><span id="mcnt">${a.filter(x=>x!=null).length} / ${q.L.length} choisis · ${S.conf[q.i]?'✓ Réponse reçue par l’animateur.':'envoi automatique à chaque choix.'}</span> Modifiable jusqu’à la correction.</p>`)}
function pickM(j,v){const q=S.st,i=q.i,a=(S.ans[i]||q.L.map(()=>null)).slice();a[j]=v===''?null:+v;S.ans[i]=a;S.conf[i]=false;lsSet(ansKey(),S.ans);send(i,a);
  const c=document.getElementById('mcnt');if(c)c.textContent=a.filter(x=>x!=null).length+' / '+q.L.length+' choisis · envoi automatique à chaque choix.';setTimeout(()=>{if(!S.conf[i]&&S.st&&S.st.i===i&&S.st.ph==='ask')send(i,S.ans[i])},4000)}
function qView(){if(S.st.ty==='m')return qViewM();const q=S.st,sel=S.ans[q.i];
  st(`<div class="pb"><i style="width:${100*(q.i+1)/q.n}%"></i></div><div style="color:var(--m)">Question ${q.i+1} / ${q.n} · touches A à ${L[q.o.length-1]} du clavier</div><div class="q" style="font-size:24px">${esc(q.q)}</div>`+
  q.o.map((o,k)=>`<button class="opt ${sel===k?'sel':''}" onclick="pick(${k})"><div class="lt">${L[k]}</div><div class="tx">${sel===k?'● ':''}${esc(o)}</div></button>`).join('')+
  (q.ind?`<div class="hint"><b>Indice</b> : ${esc(q.ind)}</div>`:'')+(sel!=null?`<p style="color:var(--m)">${S.conf[q.i]?'✓ Réponse reçue par l’animateur.':'… Envoi en cours.'} Vous pouvez la changer jusqu’à la correction.</p>`:''))}
function pick(k){const i=S.st.i;S.ans[i]=k;S.conf[i]=false;lsSet(ansKey(),S.ans);send(i,k);qView();
  setTimeout(()=>{if(!S.conf[i]&&S.st&&S.st.i===i&&S.st.ph==='ask')send(i,S.ans[i])},4000)}
function send(i,a){C.pub('qz'+S.code+'u',{t:'ans',nom:S.nom,s:S.sk,q:i,a,dev:isTel()?'tel':'pc'})}
home();rpBus();setTimeout(flushReports,3000);
</script></body></html>
