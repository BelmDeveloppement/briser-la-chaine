<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roue de tirage au sort</title>
<style>
:root{--bg:#0f1b2d;--card:#18283f;--tx:#f3f6fb;--m:#9fb0c8;--ac:#f5a623;--ok:#2fbf71}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Calibri,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.w{max-width:1100px;margin:0 auto;padding:18px;display:grid;grid-template-columns:minmax(300px,1fr) 340px;gap:20px;align-items:start}
@media(max-width:820px){.w{grid-template-columns:1fr}}
h1{margin:0 0 4px;font-size:26px}h1 b{color:var(--ac)}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;color:var(--m);font-size:14px;margin:8px 0 4px}
input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #34506f;background:#0f1b2d;color:var(--tx);font-size:16px}
textarea{height:110px}
button{background:var(--ac);color:#1b1200;border:0;border-radius:10px;padding:12px 18px;font-size:17px;font-weight:700;cursor:pointer;margin:6px 6px 0 0}
button.s{background:#34506f;color:var(--tx)}button:disabled{opacity:.5;cursor:default}
#stage{position:relative;width:100%;max-width:640px;margin:0 auto}
canvas{width:100%;height:auto;display:block}
#ptr{position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid #fff;filter:drop-shadow(0 2px 3px #000a)}
#res{font-size:min(16vw,120px);font-weight:800;text-align:center;color:var(--ac);min-height:1.2em;line-height:1.1;word-break:break-word}
#hist{color:var(--m);font-size:15px}#hist span{display:inline-block;background:#0f1b2d;border-radius:6px;padding:2px 8px;margin:2px}
.row{display:flex;gap:8px;align-items:center}.row label{margin:0}
</style></head><body><div class="w">
<div><h1>Roue de <b>tirage au sort</b></h1><p style="color:var(--m);margin:0 0 10px">Qui présente son support ? Faites tourner la roue.</p>
<div id="stage"><div id="ptr"></div><canvas id="c" width="900" height="900"></canvas></div>
<div id="res">?</div></div>
<div><div class="card"><label>Nombre d’étudiants</label><input id="n" type="number" min="2" max="200" value="24">
<label>… ou liste de prénoms (un par ligne, remplace le nombre)</label><textarea id="names"></textarea>
<div class="row"><input type="checkbox" id="norep" checked style="width:auto"><label for="norep">Ne pas retirer quelqu’un déjà tiré</label></div>
<button id="go">Faire tourner</button><button class="s" id="reset">Réinitialiser</button></div>
<div class="card"><b>Déjà tirés</b><div id="hist">—</div></div></div></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d'),R=450;
let items=[],drawn=[],ang=0,spin=false;
const COL=['#3b82f6','#10b981','#f59e0b','#ef4444','#ec4899','#8b5cf6','#14b8a6','#f97316'];
function build(){const nm=$('names').value.split('\n').map(s=>s.trim()).filter(Boolean);
 items=nm.length?nm:Array.from({length:Math.max(2,Math.min(200,+$('n').value||2))},(_,i)=>String(i+1));
 drawn=[];$('hist').textContent='—';$('res').textContent='?';draw()}
function avail(){return $('norep').checked?items.filter(i=>!drawn.includes(i)):items}
function draw(){const L=avail();x.clearRect(0,0,900,900);if(!L.length){x.fillStyle='#fff';x.font='40px sans-serif';x.textAlign='center';x.fillText('Tout le monde est passé',450,450);return}
 const a=2*Math.PI/L.length;x.save();x.translate(R,R);x.rotate(ang);
 L.forEach((t,i)=>{x.beginPath();x.moveTo(0,0);x.arc(0,0,R-6,i*a,(i+1)*a);x.closePath();x.fillStyle=COL[i%COL.length];x.fill();x.strokeStyle='#0f1b2d';x.lineWidth=2;x.stroke();
  x.save();x.rotate(i*a+a/2);x.fillStyle='#fff';x.textAlign='right';const fs=Math.max(14,Math.min(46,(R*a*0.55)));x.font='bold '+fs+'px sans-serif';x.textBaseline='middle';x.fillText(t.length>14?t.slice(0,13)+'…':t,R-26,0);x.restore()});
 x.restore();x.beginPath();x.arc(R,R,34,0,7);x.fillStyle='#0f1b2d';x.fill()}
function go(){if(spin)return;const L=avail();if(!L.length)return;spin=true;$('go').disabled=true;
 const a=2*Math.PI/L.length,k=Math.floor(Math.random()*L.length);
 // le pointeur est en haut (angle -90°) : le centre du secteur k doit s'y trouver
 const target=-Math.PI/2-(k*a+a/2);const cur=ang%(2*Math.PI);let d=target-cur;d=((d%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
 const total=d+2*Math.PI*(5+Math.floor(Math.random()*3)),t0=performance.now(),dur=5200,a0=ang;
 (function f(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);ang=a0+total*e;draw();
  if(p<1)requestAnimationFrame(f);else{const w=L[k];drawn.push(w);$('res').textContent=w;
   $('hist').innerHTML=drawn.map(s=>'<span>'+s.replace(/</g,'&lt;')+'</span>').join('');spin=false;$('go').disabled=false;setTimeout(draw,50)}})(t0)}
$('go').onclick=go;$('reset').onclick=build;$('n').oninput=build;$('names').oninput=build;$('norep').onchange=draw;build();
</script></body></html>
