const DATA={"stations": {"1": {"nom": "Reconnaissance", "en": "Reconnaissance", "id": "TA0043"}, "2": {"nom": "Préparation", "en": "Resource Development", "id": "TA0042"}, "3": {"nom": "Accès initial", "en": "Initial Access", "id": "TA0001"}, "4": {"nom": "Exécution", "en": "Execution", "id": "TA0002"}, "5": {"nom": "Persistance", "en": "Persistence", "id": "TA0003"}, "6": {"nom": "Élévation de privilèges", "en": "Privilege Escalation", "id": "TA0004"}, "7": {"nom": "Discrétion", "en": "Stealth", "id": "TA0005"}, "8": {"nom": "Défenses affaiblies", "en": "Defense Impairment", "id": "TA0112"}, "9": {"nom": "Accès aux identifiants", "en": "Credential Access", "id": "TA0006"}, "10": {"nom": "Découverte", "en": "Discovery", "id": "TA0007"}, "11": {"nom": "Mouvement latéral", "en": "Lateral Movement", "id": "TA0008"}, "12": {"nom": "Collecte", "en": "Collection", "id": "TA0009"}, "13": {"nom": "Commande et contrôle", "en": "Command and Control", "id": "TA0011"}, "14": {"nom": "Exfiltration", "en": "Exfiltration", "id": "TA0010"}, "15": {"nom": "Impact", "en": "Impact", "id": "TA0040"}}, "scenarios": [{"id": 1, "nom": "Le dimanche de TransLor", "sous": "Rançongiciel via un compte d’ancien salarié (EXO 3)", "niveau": 1, "constats": [{"tech": "T1078", "st": 3, "txt": "Samedi 23 h 47 : le VPN accepte la connexion du compte de Paul M., ancien technicien parti il y a 4 mois. Le compte n’avait jamais été désactivé.", "exp": "L’attaquant entre avec un compte valide oublié : Accès initial (T1078). Piste : désactivation des comptes au départ.", "ind": "« compte de Paul, parti il y a 4 mois » : l’attaquant arrive de l’extérieur avec un compte réel.", "pie": "Persistance (5) tentant parce qu’un compte actif permet de revenir, mais ici c’est l’entrée initiale.", "but": "Utiliser un vrai compte pour se faire passer pour un utilisateur légitime, sans rien exploiter.", "det": "Connexions à des heures ou depuis des pays inhabituels, compte de personne partie, voyage impossible (deux lieux éloignés en peu de temps).", "pro": "Désactiver les comptes au départ, authentification multifacteur, revue régulière des comptes, alertes de connexion atypique."}, {"tech": "T1133", "st": 5, "txt": "Le même compte est utilisé chaque nuit depuis la même adresse étrangère : le VPN sert de porte d’entrée durable, sans aucun logiciel malveillant.", "exp": "Un service d’accès distant exposé permet de revenir quand on veut : Persistance (T1133).", "ind": "« chaque nuit depuis la même adresse » : un accès qui dure.", "pie": "Accès initial (3), mais l’entrée a déjà eu lieu. Ici, l’intérêt est de pouvoir revenir.", "but": "Garder une porte d’entrée distante (VPN, accès bureau à distance) pour revenir à volonté.", "det": "Connexions VPN nocturnes répétées, même adresse, comptes dormants qui se réveillent.", "pro": "MFA sur tous les accès distants, limiter les comptes autorisés, journaliser et alerter sur les accès hors usage."}, {"tech": "T1087.002", "st": 10, "txt": "Dimanche 0 h 20 : une série de requêtes liste les comptes et groupes de l’annuaire, dont celui des administrateurs du domaine.", "exp": "L’attaquant cherche qui est qui avant d’aller plus loin : Découverte (T1087.002).", "ind": "« liste des comptes et groupes » : on cherche, on ne vole rien encore.", "pie": "Accès aux identifiants (9) : aucun mot de passe n’est pris.", "but": "Savoir qui existe dans l’annuaire, qui est administrateur, pour choisir ses cibles.", "det": "Séries de requêtes d’annuaire par un compte qui n’en fait jamais, outils d’énumération connus.", "pro": "Droits de lecture limités, alertes sur les requêtes massives, journalisation des contrôleurs de domaine."}, {"tech": "T1003.001", "st": 9, "txt": "À 0 h 52, un outil lit la mémoire du processus LSASS sur un serveur de fichiers. L’EDR remonte une alerte de gravité moyenne.", "exp": "Le vol des mots de passe en mémoire relève d’Accès aux identifiants (T1003.001).", "ind": "« mémoire de LSASS » : le mot de passe est lu en mémoire.", "pie": "Découverte (10) : on ne regarde pas l’environnement, on vole des identifiants.", "but": "Voler les mots de passe en mémoire pour en réutiliser les empreintes ailleurs.", "det": "Accès au processus LSASS par un outil non système, alertes EDR sur le vidage mémoire.", "pro": "Protéger LSASS (Credential Guard), limiter les droits d’administration locale, EDR."}, {"tech": "T1059.001", "st": 4, "txt": "Des scripts PowerShell encodés en base64 se lancent sur plusieurs postes depuis la même session.", "exp": "L’attaquant exécute des commandes : Exécution (T1059.001).", "ind": "« scripts PowerShell encodés » : des commandes s’exécutent.", "pie": "Discrétion (7) tentant à cause de l’encodage, mais l’action principale est l’exécution.", "but": "Exécuter des commandes et des scripts sur la machine compromise.", "det": "Journalisation PowerShell (bloc de script), lignes de commande encodées, processus parent inhabituel.", "pro": "Mode de langage contraint, journalisation activée, restriction d’exécution des scripts, EDR."}, {"tech": "T1021.001", "st": 11, "txt": "Une session Bureau à distance s’ouvre depuis le serveur de fichiers vers le contrôleur de domaine, avec le compte d’un administrateur.", "exp": "Passer d’une machine à l’autre avec des identifiants volés : Mouvement latéral (T1021.001).", "ind": "« de ce serveur vers le contrôleur de domaine » : on passe d’une machine à l’autre.", "pie": "Exécution (4) : on ne lance pas de code, on se connecte.", "but": "Se connecter à distance à une autre machine avec des identifiants volés.", "det": "Sessions Bureau à distance entre serveurs qui n’en ont pas l’habitude, connexions d’administration depuis un poste serveur.", "pro": "Limiter le Bureau à distance, comptes d’administration par niveau, segmentation réseau, MFA sur les accès d’administration."}, {"tech": "T1021.002", "st": 11, "txt": "Un exécutable est copié via les partages d’administration (C$) sur 30 serveurs en 10 minutes.", "exp": "Même tactique, autre technique : Mouvement latéral (T1021.002). Il prépare le déploiement.", "ind": "« copié sur 30 serveurs » : propagation d’une machine à plusieurs.", "pie": "Exécution (4) viendra ensuite. Ici, c’est le déplacement par les partages.", "but": "Copier des outils sur de nombreuses machines via les partages d’administration.", "det": "Écritures sur les partages C$ et ADMIN$ depuis une machine inhabituelle, propagation en peu de temps.", "pro": "Désactiver les partages inutiles, segmentation, pare-feu local, alerte sur les copies massives."}, {"tech": "T1490", "st": 15, "txt": "Les sauvegardes en ligne et les copies instantanées Windows sont supprimées à 3 h 05. La dernière sauvegarde hors ligne date de 9 jours.", "exp": "Empêcher la restauration est un Impact (T1490).", "ind": "« sauvegardes supprimées » : on détruit la capacité de se rétablir.", "pie": "Défenses affaiblies (8) : on ne coupe pas un outil de sécurité, on détruit la récupération.", "but": "Rendre la restauration impossible pour forcer le paiement de la rançon.", "det": "Suppression de copies instantanées, arrêt des services de sauvegarde, commandes de suppression de sauvegardes.", "pro": "Sauvegardes hors ligne et immuables, comptes de sauvegarde séparés, alertes sur toute suppression."}, {"tech": "T1486", "st": 15, "txt": "À 3 h 30, les fichiers de 40 serveurs portent l’extension .locked et une note de rançon s’affiche.", "exp": "Chiffrement par rançongiciel : Impact (T1486).", "ind": "« .locked, note de rançon » : l’effet final est visible.", "pie": "Exfiltration (14) : rien ne sort ici, tout est chiffré sur place.", "but": "Chiffrer les fichiers pour obtenir une rançon.", "det": "Renommages massifs de fichiers, forte activité disque, note de rançon, EDR.", "pro": "Sauvegardes testées, segmentation, EDR avec blocage, plan de réponse à incident."}, {"tech": "T1567.002", "st": 14, "txt": "Avant le chiffrement, 120 Go ont été envoyés vers un service de stockage cloud. L’attaquant menace de publier les données.", "exp": "Double extorsion : Exfiltration (T1567.002).", "ind": "« 120 Go envoyés vers un stockage cloud » : des données sortent.", "pie": "Collecte (12) : la copie est déjà faite, ici elle quitte l’entreprise.", "but": "Sortir les données vers un stockage cloud public que le réseau laisse passer.", "det": "Gros volumes vers des services de partage de fichiers, en dehors des heures de travail.", "pro": "Filtrage des services cloud non autorisés, prévention de la perte de données, alertes sur les volumes sortants."}]}, {"id": 2, "nom": "Exchange en péril", "sous": "Campagne Hafnium transposée (EXO 5)", "niveau": 3, "constats": [{"tech": "T1190", "st": 3, "txt": "Le serveur de messagerie Exchange exposé sur Internet reçoit des requêtes inhabituelles vers une page d’autodécouverte, puis une réponse anormale.", "exp": "Exploitation d’une application exposée : Accès initial (T1190). Piste : correctif et segmentation.", "ind": "« requêtes inhabituelles » sur un service exposé suivies d’une réponse anormale.", "pie": "Reconnaissance (1) : ici la faille est déjà exploitée.", "but": "Entrer par une faille d’un service exposé sur Internet, sans rien demander à personne.", "det": "Requêtes anormales dans les journaux web, erreurs applicatives, processus enfants inattendus du serveur web.", "pro": "Appliquer les correctifs rapidement, WAF, isoler les serveurs exposés dans une zone dédiée, sauvegarde de configuration."}, {"tech": "T1505.003", "st": 5, "txt": "Un fichier .aspx inconnu apparaît dans un répertoire du serveur web. Il répond à des commandes envoyées par des requêtes HTTP.", "exp": "Un web shell garantit le retour de l’attaquant : Persistance (T1505.003).", "ind": "« fichier .aspx inconnu » qui répond à des commandes : un accès caché durable.", "pie": "Exécution (4) : le web shell exécute, mais sa raison d’être est de rester.", "but": "Laisser sur un serveur web un accès caché qui survit aux redémarrages et aux correctifs.", "det": "Nouveaux fichiers dans les répertoires web, contrôle d’intégrité, requêtes vers un fichier inconnu.", "pro": "Surveiller l’intégrité des fichiers web, droits d’écriture minimaux, correctif et réinstallation propre après compromission."}, {"tech": "T1059.001", "st": 4, "txt": "Le processus du serveur web lance PowerShell, ce qui est anormal pour lui.", "exp": "Exécution (T1059.001) : le web shell exécute des commandes.", "ind": "« le processus du serveur web lance PowerShell » : des commandes sont lancées.", "pie": "Persistance (5) : le web shell est déjà installé.", "but": "Exécuter des commandes et des scripts sur la machine compromise.", "det": "Journalisation PowerShell (bloc de script), lignes de commande encodées, processus parent inhabituel.", "pro": "Mode de langage contraint, journalisation activée, restriction d’exécution des scripts, EDR."}, {"tech": "T1003.001", "st": 9, "txt": "Une copie de la mémoire de LSASS est créée sur le serveur de messagerie, puis envoyée vers le web shell.", "exp": "Accès aux identifiants (T1003.001).", "ind": "« copie de la mémoire de LSASS » : on vole des identifiants.", "pie": "Collecte (12) : la cible est un secret d’authentification, pas un document.", "but": "Voler les mots de passe en mémoire pour en réutiliser les empreintes ailleurs.", "det": "Accès au processus LSASS par un outil non système, alertes EDR sur le vidage mémoire.", "pro": "Protéger LSASS (Credential Guard), limiter les droits d’administration locale, EDR."}, {"tech": "T1003.003", "st": 9, "txt": "Une copie de la base NTDS.dit est réalisée sur un contrôleur de domaine à l’aide d’un utilitaire d’administration.", "exp": "Même tactique, autre technique : Accès aux identifiants (T1003.003). Toutes les empreintes de l’entreprise sont exposées.", "ind": "« copie de la base NTDS.dit » : toutes les empreintes d’un coup.", "pie": "Collecte (12) : l’objectif est de s’authentifier ailleurs.", "but": "Copier la base de l’annuaire pour récupérer toutes les empreintes de mots de passe.", "det": "Création de copies de NTDS.dit ou d’instantanés de volume sur un contrôleur de domaine.", "pro": "Contrôleurs de domaine isolés et durcis, comptes d’administration séparés, surveillance des copies de la base."}, {"tech": "T1560.001", "st": 12, "txt": "Des archives .zip protégées par mot de passe sont créées dans un répertoire temporaire, avec des boîtes aux lettres de la direction.", "exp": "Préparer les données avant de les sortir : Collecte (T1560.001).", "ind": "« archives protégées par mot de passe » : on prépare les données avant de les sortir.", "pie": "Exfiltration (14) : rien n’est encore sorti.", "but": "Compresser et protéger les données pour les sortir plus vite et sans être vu.", "det": "Création d’archives de grande taille dans un répertoire temporaire, outils de compression lancés par des services.", "pro": "Surveillance des outils de compression, prévention de la perte de données, limitation des droits de lecture."}, {"tech": "T1114.002", "st": 12, "txt": "Des requêtes d’export de boîtes aux lettres sont exécutées depuis le serveur, pour 14 comptes dont ceux du PDG et du DAF.", "exp": "Voler des courriels : Collecte (T1114.002).", "ind": "« export de boîtes aux lettres de 14 comptes » : on récupère des courriels.", "pie": "Exfiltration (14) : l’export est sur place, pas encore envoyé.", "but": "Lire ou copier des boîtes aux lettres pour récupérer secrets et informations de paiement.", "det": "Exports ou lectures massives de boîtes, appels d’API de messagerie depuis un compte inhabituel.", "pro": "MFA, droits d’export limités, journaux d’audit de la messagerie, alertes sur les accès délégués."}, {"tech": "T1567.002", "st": 14, "txt": "Les archives sont envoyées vers un service de partage de fichiers public, en dehors des heures ouvrées.", "exp": "Exfiltration (T1567.002) : volume élevé vers un service cloud.", "ind": "« envoyées vers un service de partage public » : les données quittent le réseau.", "pie": "Commande et contrôle (13) : c’est un envoi de données, pas un canal de pilotage.", "but": "Sortir les données vers un stockage cloud public que le réseau laisse passer.", "det": "Gros volumes vers des services de partage de fichiers, en dehors des heures de travail.", "pro": "Filtrage des services cloud non autorisés, prévention de la perte de données, alertes sur les volumes sortants."}]}, {"id": 3, "nom": "Le faux fournisseur", "sous": "Fraude au RIB par hameçonnage (EXO 6)", "niveau": 2, "constats": [{"tech": "T1583.001", "st": 2, "txt": "Un nom de domaine qui ressemble à celui d’un fournisseur de TransLor (une lettre changée) a été enregistré hier. TransLor ne le sait pas encore.", "exp": "L’attaquant prépare ses outils : Préparation (T1583.001). Piste : surveillance des domaines similaires.", "ind": "« domaine enregistré hier, une lettre changée » : l’attaquant prépare ses outils.", "pie": "Reconnaissance (1) : ici il achète, il n’observe pas.", "but": "Acheter l’infrastructure de l’attaque (domaine, serveur) avant de la lancer.", "det": "Surveillance des noms de domaine proches du vôtre et des marques (veille sur les certificats et enregistrements récents).", "pro": "Réserver les variantes de votre domaine, SPF/DKIM/DMARC, service de veille anti-usurpation."}, {"tech": "T1589.002", "st": 1, "txt": "Quelqu’un a collecté sur Internet les adresses e-mail du service comptabilité et le nom du DAF.", "exp": "Collecte d’informations sur la cible : Reconnaissance (T1589.002).", "ind": "« adresses collectées, nom du DAF » : on se renseigne sur la cible.", "pie": "Préparation (2) : l’attaquant n’a rien construit, il recueille de l’information.", "but": "Constituer la liste des personnes à viser (adresses, fonctions) pour un hameçonnage crédible.", "det": "Très difficile à voir : l’information est publique. On surveille plutôt ce qui exploite la liste.", "pro": "Limiter ce qui est publié (organigramme, signatures), sensibiliser les services exposés comme la comptabilité."}, {"tech": "T1566.002", "st": 3, "txt": "Un comptable reçoit un courriel de « son fournisseur » avec un lien vers un faux portail pour mettre à jour ses coordonnées.", "exp": "Hameçonnage par lien : Accès initial (T1566.002).", "ind": "« lien vers un faux portail » : une première interaction avec la victime.", "pie": "Reconnaissance (1) : le message est envoyé, la cible est déjà choisie.", "but": "Faire cliquer un utilisateur sur un lien piégé pour lui voler ses identifiants.", "det": "Passerelle de messagerie (réputation du lien), clics sur des domaines récents, alertes d’utilisateurs.", "pro": "Filtrage des liens, MFA résistante au hameçonnage, sensibilisation, bouton de signalement."}, {"tech": "T1078", "st": 3, "txt": "Les identifiants saisis sur le faux portail sont utilisés dans l’heure pour se connecter à la messagerie en ligne depuis un autre pays.", "exp": "Accès initial (T1078) : compte valide obtenu par hameçonnage.", "ind": "« identifiants utilisés dans l’heure » : l’attaquant se connecte pour la première fois.", "pie": "Persistance (5) : on ne cherche pas encore à rester.", "but": "Utiliser un vrai compte pour se faire passer pour un utilisateur légitime, sans rien exploiter.", "det": "Connexions à des heures ou depuis des pays inhabituels, compte de personne partie, voyage impossible (deux lieux éloignés en peu de temps).", "pro": "Désactiver les comptes au départ, authentification multifacteur, revue régulière des comptes, alertes de connexion atypique."}, {"tech": "T1114.002", "st": 12, "txt": "L’attaquant lit pendant 3 jours les échanges avec le fournisseur et repère le calendrier des paiements.", "exp": "Collecte (T1114.002) : lecture de courriels distante.", "ind": "« lit pendant 3 jours les échanges » : il récupère de l’information.", "pie": "Découverte (10) : ici on lit des données, on n’explore pas un réseau.", "but": "Lire ou copier des boîtes aux lettres pour récupérer secrets et informations de paiement.", "det": "Exports ou lectures massives de boîtes, appels d’API de messagerie depuis un compte inhabitue const ST=DATA.stations,SC=DATA.scenarios,SEUIL=4,SECS=30;
const $=s=>document.querySelector(s),A=$('#app');

const zone=n=>n<=5?1:n<=10?2:3;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---- transport ---- */
function mkId(){return 'bc'+Math.random().toString(36).slice(2,6).toUpperCase()}
function Host(code,onMsg){ // returns {send(to,msg),broadcast(msg)}
  const conns={};
  if(MOCK){const ch=new BroadcastChannel('bc-'+code);ch.onmessage=e=>{const m=e.data;if(m.to==='host'){conns[m.from]=1;onMsg(m.from,m.msg)}};
    return {send:(to,msg)=>ch.postMessage({to,msg}),broadcast:msg=>ch.postMessage({to:'*',msg}),ready:Promise.resolve()}}
  const peer=new Peer('BC-'+code);
  const ready=new Promise((ok,ko)=>{peer.on('open',ok);peer.on('error',ko)});
  peer.on('connection',c=>{c.on('open',()=>{conns[c.peer]=c});c.on('data',d=>onMsg(c.peer,d));c.on('close',()=>{onMsg(c.peer,{t:'bye'});delete conns[c.peer]})});
  return {send:(to,msg)=>conns[to]&&conns[to].send(msg),broadcast:msg=>Object.values(conns).forEach(c=>c.send(msg)),ready}
}
function Client(code,onMsg){
  const me='p'+Math.random().toString(36).slice(2,8);
  if(MOCK){const ch=new BroadcastChannel('bc-'+code);ch.onmessage=e=>{const m=e.data;if(m.to===me||m.to==='*')onMsg(m.msg)};
    return {send:msg=>ch.postMessage({to:'host',from:me,msg}),ready:Promise.resolve()}}
  const peer=new Peer();let c;
  const ready=new Promise((ok,ko)=>{peer.on('open',()=>{c=peer.connect('BC-'+code,{reliable:true});c.on('open',ok);c.on('data',onMsg);c.on('close',()=>onMsg({t:'lost'}))});peer.on('error',ko)});
  return {send:msg=>c&&c.open&&c.send(msg),ready}
}
function expl(c){return `<p>${esc(c.exp)}</p>
<div style="border-left:4px solid var(--g);padding:2px 10px;margin:8px 0"><b>Pourquoi cette station</b><br>${esc(c.ind)}</div>
<div style="border-left:4px solid var(--y);padding:2px 10px;margin:8px 0"><b>Piège à éviter</b><br>${esc(c.pie)}</div>
<div style="border-left:4px solid var(--z2);padding:2px 10px;margin:8px 0"><b>Ce que cherche l’attaquant</b><br>${esc(c.but)}</div>
<div style="border-left:4px solid var(--l);padding:2px 10px;margin:8px 0"><b>Comment le voir (détection)</b><br>${esc(c.det)}</div>
<div style="border-left:4px solid var(--z1);padding:2px 10px;margin:8px 0"><b>Comment s’en protéger en entreprise</b><br>${esc(c.pro)}</div>
<span class="chip">Technique ${esc(c.tech)}</span>`}

function home(){

  A.innerHTML=`<h1>BRISER <b>LA CHAÎNE</b></h1><p style="color:var(--m)">Jeu de plateau MITRE ATT&amp;CK, version téléphone.</p>

}
/* ---- host ---- */
let H,G;
function hostSetup(){
  const code=MOCK?mkId().slice(2):Math.random().toString(36).slice(2,6).toUpperCase();

function joinURL(){return location.origin+location.pathname+'?room='+G.code+(MOCK?'&t=bc':'')}
function lobby(){

function qr(){const e=$('#qr');if(!e)return;const u='https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data='+encodeURIComponent(joinURL());e.innerHTML=`<img src="${u}" width="220" height="220" alt="QR" style="background:#fff;border-radius:10px;margin-top:8px" onerror="this.replaceWith(document.createTextNode('QR indisponible : saisir le code'))">`}
function lobbyBtn(){const t=$('#tl');if(!t)return;t.innerHTML=G.order.length?G.order.map(i=>`<span class="chip">${esc(G.teams[i].nom)}</span>`).join(''):'<i style="color:var(--m)">En attente des équipes…</i>';const h=$('#hint');if(h)h.textContent=!G.sc?'Choisissez d’abord un scénario ci-dessus.':!G.order.length?'Aucune équipe connectée.':''}
function onPlayer(id,m){
  if(m.t==='bye'){if(G.teams[id])G.teams[id].off=1;return}
  if(m.t==='hello'){
    let k=G.order.find(i=>G.teams[i].nom.toLowerCase()===m.nom.toLowerCase());
    if(!k&&G.phase!=='lobby'){H.send(id,{t:'refus'});return}
    if(k&&k!==id){G.teams[id]=G.teams[k];delete G.teams[k];G.order[G.order.indexOf(k)]=id;if(G.answers[k]){G.answers[id]=G.answers[k];delete G.answers[k]}}
    else if(!k){G.teams[id]={nom:m.nom,bar:0,imp:0,out:0};G.order.push(id)}
    G.teams[id].off=0;H.send(id,{t:'ok',nom:m.nom});if(G.phase==='lobby')lobbyBtn();else{syncOne(id);hostView()}
  }
  if(m.t==='ans'&&G.phase==='ask'&&G.teams[id]&&!G.teams[id].out){G.answers[id]=m.st;hostView()}
}
function cur(){return SC.find(s=>s.id==G.sc).constats[G.i]}
function start(){if(!G.sc||!G.order.length){lobbyBtn();return}G.phase='next';G.i=-1;G.order.forEach(i=>Object.assign(G.teams[i],{bar:0,imp:0,out:0}));next()}
function next(){
  const s=SC.find(x=>x.id==G.sc);G.i++;G.answers={};
  if(G.i>=s.constats.length){G.phase='end';hostView();H.broadcast({t:'end',res:ranking()});return}
  G.phase='ask';G.t0=Date.now();hostView();
  H.broadcast({t:'ask',n:G.i+1,of:s.constats.length,txt:cur().txt,secs:SECS});
  clearInterval(G.tm);G.tm=setInterval(tick,250);
}
function tick(){if(G.phase!=='ask'){clearInterval(G.tm);return}const left=Math.max(0,SECS-Math.floor((Date.now()-G.t0)/1000));const e=$('#tmr');if(e)e.textContent=left;}
function live(){return G.order.filter(i=>!G.teams[i].out)}
function reveal(){
  clearInterval(G.tm);const c=cur(),res={};
  live().forEach(i=>{const t=G.teams[i],a=G.answers[i],r={ans:a||null};
    if(a===c.st){t.bar++;r.ok=1}else{r.ok=0;r.d6=1+Math.floor(Math.random()*6);r.hit=r.d6>=3;if(r.hit){r.dmg=c.st>=11?2:1;t.imp+=r.dmg;if(t.imp>=SEUIL){t.out=1;r.out=1}}}
    r.bar=t.bar;r.imp=t.imp;res[i]=r});
  G.res=res;G.phase='rev';hostView();
  G.order.forEach(i=>H.send(i,{t:'rev',st:c.st,stn:ST[c.st].nom,exp:c.exp,tech:c.tech,ind:c.ind,pie:c.pie,but:c.but,det:c.det,pro:c.pro,r:res[i]||null,last:G.i>=SC.find(x=>x.id==G.sc).constats.length-1}));
}
function syncOne(id){
  if(G.phase==='ask'){const s=SC.find(x=>x.id==G.sc);H.send(id,{t:'ask',n:G.i+1,of:s.constats.length,txt:cur().txt,secs:Math.max(0,SECS-Math.floor((Date.now()-G.t0)/1000))})}
}
function ranking(){return G.order.map(i=>{const t=G.teams[i];return{nom:t.nom,bar:t.bar,imp:t.imp,out:t.out,score:t.bar-t.imp}}).sort((a,b)=>a.out-b.out||b.score-a.score)}
function hostView(){

    <div class="row"><div class="tm" id="tmr">${SECS}</div><div>Réponses : <b>${got}</b> / ${n}</div><div style="flex:1"></div><button onclick="reveal()">Révéler</button></div>
    <div>${live().map(i=>`<span class="chip ${G.answers[i]?'ok':''}">${esc(G.teams[i].nom)} ${G.answers[i]?'✓':'…'}</span>`).join('')}</div></div>
    <div class="card" style="color:var(--m)">Placez le pion Attaquant après la révélation. Station attendue : <b>${c.st}. ${ST[c.st].nom}</b> (visible par l’animateur seulement).</div>`;
  }else if(G.phase==='rev'){
    h+=`<div class="card"><div style="color:var(--m)">Constat ${G.i+1} / ${s.constats.length}</div><div class="big">${esc(c.txt)}</div>
    <h2 class="ok">Station ${c.st} : ${ST[c.st].nom} (${ST[c.st].id})</h2>${expl(c)}
    <p><b>Pion Attaquant</b> sur la station ${c.st}. Barrières sur la station pour les équipes justes.</p>
    <table><tr><th>Équipe</th><th>Réponse</th><th>Résultat</th><th>Barrières</th><th>Impact</th></tr>
    ${G.order.map(i=>{const t=G.teams[i],r=G.res[i];if(!r)return`<tr class="gone"><td>${esc(t.nom)}</td><td colspan=4>compromise</td></tr>`;
      return`<tr><td>${esc(t.nom)}</td><td>${r.ans?r.ans+'. '+ST[r.ans].nom:'—'}</td><td>${r.ok?'<span class=ok>Juste → Barrière</span>':'<span class=ko>Faux, dé '+r.d6+' : '+(r.hit?'+'+r.dmg+' Impact':'attaque repoussée')+(r.out?' ☠ COMPROMISE':'')+'</span>'}</td><td>${r.bar}</td><td>${r.imp}/${SEUIL}</td></tr>`}).join('')}</table>
    <div class="row" style="margin-top:12px"><button onclick="next()">${G.i>=s.constats.length-1?'Voir le classement':'Constat suivant'}</button></div></div>`;
  }else if(G.phase==='end'){
    h+=`<div class="card"><h2>Classement final</h2><table><tr><th>#</th><th>Équipe</th><th>Barrières</th><th>Impact</th><th>Score</th></tr>${ranking().map((r,k)=>`<tr class="${r.out?'gone':''}"><td>${r.out?'☠':k+1}</td><td>${esc(r.nom)}</td><td>${r.bar}</td><td>${r.imp}</td><td><b>${r.score}</b></td></tr>`).join('')}</table>
    <p style="color:var(--m)">Score = Barrières − Impact. Une équipe à ${SEUIL} d’Impact est compromise et sort du classement.</p>
    <h3>Rappel de la chaîne d’attaque</h3><ol>${s.constats.map(x=>`<li>${esc(x.txt)}<br><b>${x.st}. ${ST[x.st].nom}</b> <span style="color:var(--m)">(${x.tech})</span></li>`).join('')}</ol>
    <button onclick="location.reload()">Nouvelle partie</button></div>`;
  }
  A.innerHTML=h;
}
/* ---- player ---- */
let C,P={};
function join(code){
  if(!code)return;
  const saved=sessionStorage.getItem('nom-'+code)||'';
  A.innerHTML=`<h1>BRISER <b>LA CHAÎNE</b></h1><div class="card"><p>Partie <b>${esc(code)}</b></p><input id="nom" maxlength="20" placeholder="Nom de votre équipe" value="${esc(saved)}"><br><br><button onclick="hello('${esc(code)}')">Entrer</button><p id="msg" style="color:var(--m)"></p></div>`;
}
function hello(code){
  const nom=$('#nom').value.trim();if(!nom)return;try{sessionStorage.setItem('nom-'+code,nom)}catch(e){}
  $('#msg').textContent='Connexion…';P={code,nom,sel:null};
  C=Client(code,onHost);
  C.ready.then(()=>C.send({t:'hello',nom}),()=>{$('#msg').textContent='Connexion impossible. Vérifiez le code et le réseau.'});
}
function onHost(m){
  if(m.t==='ok')return wait('Connecté. En attente du début de la partie…');
  if(m.t==='refus')return wait('Partie déjà commencée. Rejoignez avec le même nom d’équipe qu’avant.');
  if(m.t==='lost')return wait('Connexion perdue. Rechargez la page et saisissez le même nom.');
  if(m.t==='ask'){P.sel=null;P.m=m;P.t0=Date.now();ask()}
  if(m.t==='rev')rev(m);
  if(m.t==='end')end(m);
}
function wait(t){A.innerHTML=`<h1>BRISER <b>LA CHAÎNE</b></h1><div class="card"><b>${esc(P.nom||'')}</b><p>${esc(t)}</p></div>`}
function ask(){
  const m=P.m;let h=`<div style="color:var(--m)">${esc(P.nom)} · Constat ${m.n}/${m.of}</div><div class="card"><div style="font-size:18px">${esc(m.txt)}</div></div><p style="margin:6px 0">Sur quelle station se trouve l’attaquant ?</p>`;
  for(const z of [1,2,3]){h+=`<div style="color:var(--m);margin:8px 0 4px">${['','DEHORS · préparer et entrer','DEDANS · s’installer et progresser','LE CŒUR · prendre et partir'][z]}</div><div class="grid" style="grid-template-columns:1fr 1fr">`;
    for(let n=(z-1)*5+1;n<=z*5;n++)h+=`<button class="st z${z} ${P.sel===n?'sel':''}" onclick="pick(${n})">${n}. ${ST[n].nom}<small>${ST[n].en}</small></button>`;h+='</div>'}
  h+=`<p id="ok" style="color:var(--g)">${P.sel?'Réponse envoyée : station '+P.sel+'. Vous pouvez la changer.':''}</p>`;
  A.innerHTML=h;
}
function pick(n){P.sel=n;C.send({t:'ans',st:n});ask()}
function rev(m){
  const r=m.r;let h=`<div style="color:var(--m)">${esc(P.nom)}</div>`;
  if(!r)h+=`<div class="card ko"><h2>Votre équipe est compromise</h2></div>`;
  else if(r.ok)h+=`<div class="card"><h2 class="ok">Juste ! +1 Barrière</h2></div>`;
  else h+=`<div class="card"><h2 class="ko">${r.ans?'Pas la bonne station':'Pas de réponse'}</h2><p>Dé : <b style="font-size:28px">${r.d6}</b> → ${r.hit?'<b class=ko>+'+r.dmg+' Impact</b>':'<b class=ok>attaque repoussée</b>'}${r.out?'<br><b class=ko>☠ Votre équipe est compromise</b>':''}</p></div>`;
  h+=`<div class="card"><div style="color:var(--m)">Bonne réponse</div><h2>${m.st}. ${esc(m.stn)}</h2>${expl(m)}</div>`;
  if(r)h+=`<div class="card">Barrières <b>${r.bar}</b> · Impact <b>${r.imp}/4</b></div>`;
  A.innerHTML=h+'<p style="color:var(--m)">En attente du constat suivant…</p>';
}
function end(m){A.innerHTML=`<h1>Classement</h1><div class="card"><table>${m.res.map((r,k)=>`<tr class="${r.out?'gone':''}"><td>${r.out?'☠':k+1}</td><td>${esc(r.nom)}</td><td><b>${r.score}</b></td></tr>`).join('')}</table></div>`}
home();
</script></body></html>
